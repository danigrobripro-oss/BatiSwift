<!-- Styles pour la sidebar -->
<style>
/* ── SIDEBAR MOBILE ── */
.sidebar-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 299;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}
.sidebar-overlay.active {
  opacity: 1;
  pointer-events: auto;
}

.mobile-sidebar {
  position: fixed;
  top: 0;
  left: -320px;
  width: 300px;
  max-width: 80vw;
  height: 100vh;
  background: var(--blanc, #fff);
  z-index: 300;
  padding: 1.5rem;
  box-shadow: 4px 0 32px rgba(0,0,0,0.12);
  transition: left 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
  overflow-y: auto;
}
.mobile-sidebar.active {
  left: 0;
}
.sidebar-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: 1rem;
  border-bottom: 1px solid var(--beige-dark, #ede6dd);
}
.sidebar-close {
  background: none;
  border: none;
  font-size: 1.6rem;
  color: var(--gris, #8b8b8b);
  cursor: pointer;
  padding: 0 0.5rem;
}
.sidebar-close:hover {
  color: var(--anthracite, #2b2b2b);
}
.sidebar-nav {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}
.sidebar-nav a {
  padding: 0.8rem 1rem;
  border-radius: var(--radius, 14px);
  font-size: 1rem;
  font-weight: 500;
  color: var(--anthracite, #2b2b2b);
  transition: background 0.2s;
  text-decoration: none;
}
.sidebar-nav a:hover {
  background: var(--beige, #f5f0eb);
}
.sidebar-actions {
  margin-top: auto;
  display: flex;
  flex-direction: column;
  gap: 0.8rem;
  padding-top: 1rem;
  border-top: 1px solid var(--beige-dark, #ede6dd);
}
.sidebar-actions .btn {
  text-align: center;
}

/* ── RESPONSIVE ── */
@media (min-width: 769px) {
  .sidebar-overlay,
  .mobile-sidebar,
  .nav-hamburger {
    display: none !important;
  }
}
@media (max-width: 768px) {
  .nav-links {
    display: none !important;
  }
  .nav-actions .nav-guest,
  .nav-actions .nav-user {
    display: none !important;
  }
  /* On garde le burger visible */
  .nav-hamburger {
    display: flex !important;
  }
}

/* Animation du burger en X */
.nav-hamburger.open .bar:nth-child(1) {
  transform: rotate(45deg) translate(5px, 5px);
}
.nav-hamburger.open .bar:nth-child(2) {
  opacity: 0;
}
.nav-hamburger.open .bar:nth-child(3) {
  transform: rotate(-45deg) translate(5px, -5px);
}
</style>

<script>
// ─── SIDEBAR MOBILE ──────────────────────────────────────
(function initMobileSidebar() {
  var burgerBtn = document.getElementById('burger-btn');
  var overlay = document.getElementById('sidebar-overlay');
  var sidebar = document.getElementById('mobile-sidebar');
  var closeBtn = document.getElementById('sidebar-close');
  var sidebarLinks = sidebar ? sidebar.querySelectorAll('a') : [];

  function openSidebar() {
    if (burgerBtn) burgerBtn.classList.add('open');
    if (overlay) overlay.classList.add('active');
    if (sidebar) sidebar.classList.add('active');
    document.body.style.overflow = 'hidden';
  }

  function closeSidebar() {
    if (burgerBtn) burgerBtn.classList.remove('open');
    if (overlay) overlay.classList.remove('active');
    if (sidebar) sidebar.classList.remove('active');
    document.body.style.overflow = '';
  }

  if (burgerBtn) burgerBtn.addEventListener('click', openSidebar);
  if (closeBtn) closeBtn.addEventListener('click', closeSidebar);
  if (overlay) overlay.addEventListener('click', closeSidebar);

  // Fermer la sidebar au clic sur un lien
  sidebarLinks.forEach(function(link) {
    link.addEventListener('click', function() {
      closeSidebar();
    });
  });
})();
</script>
