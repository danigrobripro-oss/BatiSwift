<!-- header.html – avec sidebar mobile (côté droit) -->
<header class="site-header">
  <div class="container">
    <!-- Logo -->
    <a href="/index.html" class="nav-logo">
      <img src="/assets/logo.svg" alt="BâtiSwift" class="logo-svg">
      BâtiSwift
    </a>

    <!-- Navigation Desktop -->
    <nav aria-label="Navigation principale">
      <ul class="nav-links" id="nav-links-list">
        <li><a href="/index.html" class="nav-link">Accueil</a></li>
        <li><a href="/client.html" class="nav-link nav-guest">Déposer une demande</a></li>
        <li><a href="/tarifs.html" class="nav-link nav-guest">Tarifs</a></li>
        <li><a href="/aide.html" class="nav-link nav-guest">Aide</a></li>
      </ul>
    </nav>

    <!-- Actions Desktop + Mobile -->
    <div class="nav-actions">
      <!-- INVITÉ : Connexion / Inscription (toujours visibles) -->
      <div class="nav-guest">
        <a href="/connexion.html" class="btn btn-secondary btn-sm">Connexion</a>
        <a href="/inscription.html" class="btn btn-primary btn-sm">S'inscrire</a>
      </div>
      <!-- CONNECTÉ : User info + Dashboard + Paramètres + Déconnexion -->
      <div class="nav-user" style="display:none;">
        <span id="nav-user-greeting"></span>
        <a href="/dashboard.html" class="btn btn-secondary btn-sm">Mon Espace</a>
        <a href="/parametres.html" class="btn btn-secondary btn-sm">⚙</a>
        <button data-action="logout" class="btn btn-primary btn-sm">Déconnexion</button>
      </div>
    </div>

    <!-- Bouton Burger (visible uniquement sur mobile) -->
    <button class="nav-hamburger" id="burger-btn" aria-label="Menu" aria-expanded="false">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>
  </div>
</header>

<!-- SIDEBAR MOBILE (s'ouvre à droite, du côté du burger) -->
<div id="sidebar-overlay" class="sidebar-overlay"></div>
<div id="mobile-sidebar" class="mobile-sidebar">
  <div class="sidebar-header">
    <a href="/index.html" class="nav-logo">
      <img src="/assets/logo.svg" alt="BâtiSwift" class="logo-svg">
      BâtiSwift
    </a>
    <button id="sidebar-close" class="sidebar-close" aria-label="Fermer le menu">✕</button>
  </div>
  <nav class="sidebar-nav">
    <a href="/index.html">🏠 Accueil</a>
    <a href="/client.html">💬 Déposer une demande</a>
    <a href="/tarifs.html">💰 Tarifs</a>
    <a href="/aide.html">❓ Aide</a>
  </nav>
  <div class="sidebar-actions">
    <a href="/connexion.html" class="btn btn-secondary btn-block">Connexion</a>
    <a href="/inscription.html" class="btn btn-primary btn-block">S'inscrire</a>
  </div>
</div>

<style>
/* ── SIDEBAR MOBILE (côté droit) ── */
.sidebar-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 299;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}
.sidebar-overlay.active {
  opacity: 1;
  pointer-events: auto;
}

.mobile-sidebar {
  position: fixed;
  top: 0;
  right: -320px;           /* ← OUVRE À DROITE */
  width: 300px;
  max-width: 80vw;
  height: 100vh;
  background: var(--blanc, #fff);
  z-index: 300;
  padding: 1.5rem;
  box-shadow: -4px 0 32px rgba(0,0,0,0.12);  /* ← ombre à gauche */
  transition: right 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
  overflow-y: auto;
}
.mobile-sidebar.active {
  right: 0;               /* ← GLISSE DEPUIS LA DROITE */
}
.sidebar-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: 1rem;
  border-bottom: 1px solid var(--beige-dark, #ede6dd);
}
.sidebar-close {
  background: none;
  border: none;
  font-size: 1.6rem;
  color: var(--gris, #8b8b8b);
  cursor: pointer;
  padding: 0 0.5rem;
}
.sidebar-close:hover {
  color: var(--anthracite, #2b2b2b);
}
.sidebar-nav {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}
.sidebar-nav a {
  padding: 0.8rem 1rem;
  border-radius: var(--radius, 14px);
  font-size: 1rem;
  font-weight: 500;
  color: var(--anthracite, #2b2b2b);
  transition: background 0.2s;
  text-decoration: none;
}
.sidebar-nav a:hover {
  background: var(--beige, #f5f0eb);
}
.sidebar-actions {
  margin-top: auto;
  display: flex;
  flex-direction: column;
  gap: 0.8rem;
  padding-top: 1rem;
  border-top: 1px solid var(--beige-dark, #ede6dd);
}
.sidebar-actions .btn {
  text-align: center;
}

/* ── BURGER ANIMATION (X) ── */
.nav-hamburger.open .bar:nth-child(1) {
  transform: rotate(45deg) translate(5px, 5px);
}
.nav-hamburger.open .bar:nth-child(2) {
  opacity: 0;
}
.nav-hamburger.open .bar:nth-child(3) {
  transform: rotate(-45deg) translate(5px, -5px);
}

/* ── RESPONSIVE ── */
@media (min-width: 769px) {
  .sidebar-overlay,
  .mobile-sidebar,
  .nav-hamburger {
    display: none !important;
  }
}

@media (max-width: 768px) {
  /* Cacher la navigation desktop */
  .nav-links {
    display: none !important;
  }

  /* Afficher le burger */
  .nav-hamburger {
    display: flex !important;
  }

  /* ── BOUTONS CONNEXION / INSCRIPTION : TOUJOURS VISIBLES ── */
  .nav-actions .nav-guest {
    display: flex !important;
    gap: 4px;
    align-items: center;
  }
  .nav-actions .nav-guest .btn {
    font-size: 0.65rem;
    padding: 4px 8px;
    white-space: nowrap;
  }

  /* Mode connecté : réduction des boutons */
  .nav-actions .nav-user {
    display: flex !important;
    gap: 4px;
    align-items: center;
  }
  .nav-actions .nav-user .btn {
    font-size: 0.6rem;
    padding: 3px 6px;
    white-space: nowrap;
  }
  #nav-user-greeting {
    font-size: 0.7rem;
    white-space: nowrap;
  }
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
  // ─── SIDEBAR MOBILE ──────────────────────────────────────
  var burgerBtn = document.getElementById('burger-btn');
  var overlay = document.getElementById('sidebar-overlay');
  var sidebar = document.getElementById('mobile-sidebar');
  var closeBtn = document.getElementById('sidebar-close');
  var sidebarLinks = sidebar ? sidebar.querySelectorAll('a') : [];

  function openSidebar() {
    if (burgerBtn) burgerBtn.classList.add('open');
    if (overlay) overlay.classList.add('active');
    if (sidebar) sidebar.classList.add('active');
    document.body.style.overflow = 'hidden';
  }

  function closeSidebar() {
    if (burgerBtn) burgerBtn.classList.remove('open');
    if (overlay) overlay.classList.remove('active');
    if (sidebar) sidebar.classList.remove('active');
    document.body.style.overflow = '';
  }

  if (burgerBtn) burgerBtn.addEventListener('click', openSidebar);
  if (closeBtn) closeBtn.addEventListener('click', closeSidebar);
  if (overlay) overlay.addEventListener('click', closeSidebar);

  sidebarLinks.forEach(function(link) {
    link.addEventListener('click', closeSidebar);
  });

  // ─── GESTION DE SESSION ──────────────────────────────────
  var user = JSON.parse(localStorage.getItem('batiswift_user') || 'null');
  var guest = document.querySelector('.nav-guest');
  var userDiv = document.querySelector('.nav-user');
  var greeting = document.getElementById('nav-user-greeting');

  if (user && userDiv && guest) {
    guest.style.display = 'none';
    userDiv.style.display = 'flex';
    if (greeting) greeting.textContent = '👋 ' + user.nom;
  }

  // ─── DÉCONNEXION ─────────────────────────────────────────
  document.querySelector('[data-action="logout"]')?.addEventListener('click', function() {
    localStorage.removeItem('batiswift_token');
    localStorage.removeItem('batiswift_user');
    window.location.href = '/index.html';
  });
});
</script>
