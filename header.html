<script src="session.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    if (typeof initSession === 'function') {
      initSession();
    } else {
      console.warn('⚠️ initSession non disponible – session.js non chargé');
    }
    loadArtisansCount();
  });

  async function loadArtisansCount() {
    try {
      const res = await fetch('https://agent-btp.onrender.com/api/stats/public');
      const data = await res.json();
      document.getElementById('artisans-count').textContent = data.artisans || 0;
    } catch(e) { console.error('Erreur compteur', e); }
  }
</script>
