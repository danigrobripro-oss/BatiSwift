    </a>

    <nav aria-label="Navigation principale">
      <ul class="nav-links" id="nav-links-list">
        <li><a href="/index.html" class="nav-link">Accueil</a></li>
        <li><a href="/client.html" class="nav-link nav-guest">Déposer une demande</a></li>
        <li><a href="/tarifs.html" class="nav-link nav-guest">Tarifs</a></li>
        <li><a href="/aide.html" class="nav-link nav-guest">Aide</a></li>
      </ul>
    </nav>

    <div class="nav-actions">
      <!-- Invité : Connexion + Inscription -->
      <div class="nav-guest" id="nav-guest-buttons">
        <a href="/connexion.html" class="btn btn-secondary btn-sm">Connexion</a>
        <a href="/inscription.html" class="btn btn-primary btn-sm">S'inscrire</a>
      </div>
      <!-- Connecté : Prénom + Dashboard + Paramètres + Déconnexion -->
      <div class="nav-user" id="nav-user-buttons" style="display:none;">
        <span id="nav-user-greeting"></span>
        <a href="/dashboard.html" class="btn btn-secondary btn-sm">Mon Espace</a>
        <a href="/parametres.html" class="btn btn-secondary btn-sm">⚙</a>
        <button data-action="logout" class="btn btn-primary btn-sm">Déconnexion</button>
      </div>
    </div>

    <!-- Hamburger mobile -->
    <button class="nav-hamburger" id="hamburger" aria-label="Menu" aria-expanded="false">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>
  </div>
</header>

<style>
/* ── Correction mobile : boutons en ligne ── */
.nav-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}
.nav-guest,
.nav-user {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: nowrap; /* ← FORCE l'alignement horizontal */
}
.nav-guest .btn,
.nav-user .btn {
  white-space: nowrap; /* ← Empêche le texte de passer à la ligne */
}

/* ── Correction menu hamburger ── */
.nav-hamburger {
  display: none;
  flex-direction: column;
  gap: 4px;
  background: none;
  border: none;
  cursor: pointer;
  padding: 4px;
}
.nav-hamburger .bar {
  width: 26px;
  height: 3px;
  background: var(--anthracite, #2b2b2b);
  border-radius: 4px;
  transition: all 0.3s ease;
}

/* ── RESPONSIVE ── */
@media (max-width: 768px) {
  /* Afficher le hamburger */
  .nav-hamburger {
    display: flex;
  }

  /* Cacher la navigation par défaut */
  .nav-links {
    display: none;
    flex-direction: column;
    position: absolute;
    top: var(--header-h, 72px);
    left: 0;
    right: 0;
    background: var(--blanc, #ffffff);
    padding: 1.5rem 2rem;
    border-bottom: 1px solid var(--beige-dark, #ede6dd);
    box-shadow: 0 8px 32px rgba(0,0,0,0.08);
    gap: 8px;
    z-index: 999;
  }
  .nav-links.mobile-open {
    display: flex;
  }
  .nav-links li {
    width: 100%;
  }
  .nav-links li a {
    display: block;
    padding: 12px 16px;
    text-align: center;
    font-size: 1rem;
    border-radius: var(--radius, 14px);
    transition: background 0.2s;
  }
  .nav-links li a:hover {
    background: var(--beige, #f5f0eb);
  }

  /* Animation du hamburger en "X" */
  .nav-hamburger.open .bar:nth-child(1) {
    transform: rotate(45deg) translate(5px, 5px);
  }
  .nav-hamburger.open .bar:nth-child(2) {
    opacity: 0;
  }
  .nav-hamburger.open .bar:nth-child(3) {
    transform: rotate(-45deg) translate(5px, -5px);
  }

  /* Correction : boutons en ligne sur mobile */
  .nav-guest,
  .nav-user {
    flex-wrap: nowrap !important;
    gap: 6px;
  }
  .nav-guest .btn,
  .nav-user .btn {
    font-size: 0.75rem;
    padding: 6px 12px;
    white-space: nowrap;
  }
  #nav-user-greeting {
    font-size: 0.75rem;
    margin-right: 4px;
  }
}

@media (max-width: 480px) {
  .nav-guest .btn,
  .nav-user .btn {
    font-size: 0.7rem;
    padding: 4px 8px;
  }
  .nav-links li a {
    padding: 10px 12px;
    font-size: 0.9rem;
  }
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
  // ─── HAMBURGER ──────────────────────────────────────
  var hamburger = document.getElementById('hamburger');
  var navLinks = document.getElementById('nav-links-list');

  if (hamburger && navLinks) {
    // Ouvrir/fermer le menu
    hamburger.addEventListener('click', function(e) {
      e.stopPropagation(); // Évite que le clic remonte
      var isOpen = this.classList.toggle('open');
      navLinks.classList.toggle('mobile-open');
      this.setAttribute('aria-expanded', isOpen);
    });

    // Fermer le menu en cliquant sur un lien
    navLinks.querySelectorAll('a').forEach(function(link) {
      link.addEventListener('click', function() {
        navLinks.classList.remove('mobile-open');
        hamburger.classList.remove('open');
        hamburger.setAttribute('aria-expanded', 'false');
      });
    });

    // Fermer le menu en cliquant en dehors (optionnel)
    document.addEventListener('click', function(e) {
      if (!e.target.closest('.site-header')) {
        navLinks.classList.remove('mobile-open');
        hamburger.classList.remove('open');
        hamburger.setAttribute('aria-expanded', 'false');
      }
    });
  }

  // ─── GESTION DE LA SESSION ──────────────────────────
  // (le code existant de gestion de session peut rester)
  // Exemple de bascule entre mode invité/connecté
  // Tu peux garder ton code existant ici.
});
</script>
