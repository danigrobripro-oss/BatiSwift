<style>
/* ============================================================
   STYLES CRITIQUES (version courte)
   ============================================================ */
.site-header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 200;
  height: 72px;
  display: flex;
  align-items: center;
  background: rgba(245,240,235,0.9);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid #EDE6DD;
  padding: 0 1.5rem;
}
.site-header .container {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  max-width: 1180px;
  margin: 0 auto;
}
.nav-logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.4rem;
  font-weight: 700;
  color: #2B2B2B;
  text-decoration: none;
}
.logo-svg {
  width: 40px;
  height: auto;
}
.menu-toggle {
  display: flex;
  flex-direction: column;
  gap: 5px;
  background: none;
  border: none;
  cursor: pointer;
  padding: 8px;
}
.menu-toggle .bar {
  width: 28px;
  height: 3px;
  background: #2B2B2B;
  border-radius: 4px;
  transition: all 0.3s ease;
}
.menu-toggle.open .bar:nth-child(1) { transform: rotate(45deg) translate(6px, 6px); }
.menu-toggle.open .bar:nth-child(2) { opacity: 0; }
.menu-toggle.open .bar:nth-child(3) { transform: rotate(-45deg) translate(6px, -6px); }

.sidebar-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 299;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}
.sidebar-overlay.active {
  opacity: 1;
  pointer-events: auto;
}

.sidebar {
  position: fixed;
  top: 0;
  right: -380px;
  width: 340px;
  max-width: 85vw;
  height: 100vh;
  background: #FFFFFF;
  z-index: 300;
  padding: 1.8rem;
  box-shadow: -4px 0 40px rgba(0,0,0,0.15);
  transition: right 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
  overflow-y: auto;
}
.sidebar.active {
  right: 0;
}
.sidebar-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: 1rem;
  border-bottom: 1px solid #EDE6DD;
}
.sidebar-close {
  background: none;
  border: none;
  font-size: 1.6rem;
  color: #8B8B8B;
  cursor: pointer;
  padding: 0 0.5rem;
}
.sidebar-close:hover {
  color: #2B2B2B;
}
.sidebar-nav {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}
.sidebar-nav a {
  padding: 0.8rem 1rem;
  border-radius: 14px;
  font-size: 1rem;
  font-weight: 500;
  color: #2B2B2B;
  transition: background 0.2s;
  text-decoration: none;
}
.sidebar-nav a:hover {
  background: #F5F0EB;
}

/* ---- Correction : boutons remontés ---- */
.sidebar-actions {
  margin-top: 0;              /* ← au lieu de auto */
  padding-top: 0.5rem;        /* ← réduit de 1rem à 0.5rem */
  display: flex;
  flex-direction: column;
  gap: 0.8rem;
  border-top: 1px solid #EDE6DD;
}
.sidebar-actions .btn {
  text-align: center;
  display: block;
  width: 100%;
}
.sidebar-actions .btn-secondary {
  background: transparent;
  color: #2B2B2B;
  border: 1.5px solid #D4D0CB;
}
.sidebar-actions .btn-primary {
  background: #2B2B2B;
  color: #FFFFFF;
}
.sidebar-actions .btn-danger {
  background: #EF4444;
  color: #FFFFFF;
}
.sidebar-actions .btn-block {
  width: 100%;
  padding: 12px 16px;
  border-radius: 50px;
  font-size: 0.95rem;
  font-weight: 500;
  border: none;
  cursor: pointer;
  text-decoration: none;
  text-align: center;
  transition: all 0.2s;
}
</style>

<script>
// ════════════════════════════════════════════════════════════════
// SCRIPT RÉSILIENT (s'exécute même si chargé dynamiquement)
// ════════════════════════════════════════════════════════════════
(function initHeader() {
  console.log('🔍 Header : initialisation...');

  // ---- 1. Récupérer les éléments ----
  var toggle = document.getElementById('menu-toggle');
  var overlay = document.getElementById('sidebar-overlay');
  var sidebar = document.getElementById('sidebar');
  var closeBtn = document.getElementById('sidebar-close');
  var allLinks = sidebar ? sidebar.querySelectorAll('a') : [];

  if (!toggle || !sidebar || !overlay) {
    console.warn('⚠️ Header : éléments manquants (ids incorrects ?)');
    return;
  }

  console.log('✅ Header : éléments trouvés');

  // ---- 2. Fonctions d’ouverture / fermeture ----
  function openSidebar() {
    toggle.classList.add('open');
    overlay.classList.add('active');
    sidebar.classList.add('active');
    document.body.style.overflow = 'hidden';
    console.log('📂 Sidebar ouverte');
  }

  function closeSidebar() {
    toggle.classList.remove('open');
    overlay.classList.remove('active');
    sidebar.classList.remove('active');
    document.body.style.overflow = '';
    console.log('📂 Sidebar fermée');
  }

  // ---- 3. Écouteurs d’événements ----
  toggle.addEventListener('click', function(e) {
    e.stopPropagation();
    if (sidebar.classList.contains('active')) {
      closeSidebar();
    } else {
      openSidebar();
    }
  });

  if (closeBtn) closeBtn.addEventListener('click', closeSidebar);
  if (overlay) overlay.addEventListener('click', closeSidebar);

  allLinks.forEach(function(link) {
    link.addEventListener('click', closeSidebar);
  });

  // ---- 4. Gestion de session (Connexion / Inscription) ----
  var user = JSON.parse(localStorage.getItem('batiswift_user') || 'null');
  var guestDiv = document.querySelector('.sidebar-guest');
  var userDiv = document.querySelector('.sidebar-user');
  var userNameSpan = document.getElementById('sidebar-user-nom');

  if (user && userDiv && guestDiv) {
    guestDiv.style.display = 'none';
    userDiv.style.display = 'flex';
    userDiv.style.flexDirection = 'column';
    userDiv.style.gap = '0.8rem';
    if (userNameSpan) userNameSpan.textContent = user.nom || 'Artisan';
    console.log('👤 Utilisateur connecté :', user.nom);
  } else {
    console.log('👤 Utilisateur invité');
  }

  // ---- 5. Déconnexion ----
  document.getElementById('sidebar-logout')?.addEventListener('click', function() {
    localStorage.removeItem('batiswift_token');
    localStorage.removeItem('batiswift_user');
    window.location.href = '/index.html';
  });

  console.log('✅ Header initialisé avec succès');
})();
</script>
