<!-- header.html — Espace Artisan BâtiSwift -->
<header class="site-header site-header--artisan" id="site-header">
  <div class="container">
    <a href="/dashboard.html" class="nav-logo">
      <img src="/assets/logo.svg" alt="BâtiSwift" class="logo-svg">
      <span>BâtiSwift</span>
    </a>

    <!-- Indicateur de contexte (desktop) -->
    <div class="header-context-badge" id="header-context-badge" style="display:none;">
      🛠️ <span>Espace Artisan</span>
    </div>

    <button class="menu-toggle" id="menu-toggle" aria-label="Ouvrir le menu" aria-expanded="false">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>
  </div>
</header>

<div id="sidebar-overlay" class="sidebar-overlay"></div>
<div id="sidebar" class="sidebar" role="navigation" aria-label="Navigation principale">
  <div class="sidebar-header">
    <a href="/dashboard.html" class="nav-logo">
      <img src="/assets/logo.svg" alt="BâtiSwift" class="logo-svg">
      <span>BâtiSwift</span>
    </a>

  <div class="sidebar-user" style="display:none;">

      </div>

    <!-- Switcher de contexte — visible UNIQUEMENT pour les comptes mixtes -->

      <button id="btn-switch-context" class="btn btn-secondary btn-sm btn-block">
        <span id="context-switcher-text">🏠 Passer en mode Client</span>
      </button>
    </div>
  </div>

  <!-- Navigation Artisan -->
  <nav class="sidebar-nav">
    <div class="sidebar-section-label" data-context-only="artisan">Espace Artisan</div>
    <a href="/dashboard.html"     data-context-only="artisan">📊 Tableau de bord</a>
    <a href="/marketplace.html"   data-context-only="artisan">🔥 Marketplace</a>
    <a href="/achats.html"        data-context-only="artisan">📦 Mes achats</a>
    <a href="/carte.html"         data-context-only="artisan">🗺️ Carte des chantiers</a>
    <a href="/stripe.html"        data-context-only="artisan">💳 Paiements Stripe</a>
    <a href="/parametres.html"    data-context-only="artisan">⚙️ Paramètres Pro</a>

    <div class="sidebar-section-label" data-context-only="client">Espace Client</div>
    <a href="/client-dashboard.html" data-context-only="client">🏠 Mon espace</a>
    <a href="/client.html"           data-context-only="client">💬 Nouvelle demande</a>
    <a href="/carte.html"            data-context-only="client">🔎 Trouver un artisan</a>

    <div class="sidebar-section-label" data-context-only="all">Général</div>
    <a href="/aide.html"   data-context-only="all">❓ Centre d'aide</a>
    <a href="/tarifs.html" data-context-only="all">💰 Tarifs</a>
  </nav>

  <div class="sidebar-actions">
    <!-- Invité -->
    <div class="sidebar-guest">
      <a href="/connexion.html"  class="btn btn-secondary btn-block">Connexion</a>
      <a href="/inscription.html" class="btn btn-primary btn-block">S'inscrire</a>
    </div>
    <!-- Connecté -->
    <div class="sidebar-user" style="display:none;">
      <button id="sidebar-logout" class="btn btn-danger btn-block">Déconnexion</button>
    </div>
  </div>
</div>

<style>

<script>
(function initHeaderArtisan() {
  'use strict';
  var toggle  = document.getElementById('menu-toggle');
  var overlay = document.getElementById('sidebar-overlay');
  var sidebar = document.getElementById('sidebar');
  var closeBtn = document.getElementById('sidebar-close');
  var headerEl = document.getElementById('site-header');

  if (!toggle || !sidebar || !overlay) {
    console.warn('BâtiSwift header: éléments manquants.');
    return;
  }

  // ── Sidebar open/close ────────────────────────────────────
  function openSidebar() {
    toggle.classList.add('open');
    toggle.setAttribute('aria-expanded', 'true');
    overlay.classList.add('active');
    sidebar.classList.add('active');
    document.body.style.overflow = 'hidden';
  }

  function closeSidebar() {
    toggle.classList.remove('open');
    toggle.setAttribute('aria-expanded', 'false');
    overlay.classList.remove('active');
    sidebar.classList.remove('active');
    document.body.style.overflow = '';
  }

  toggle.addEventListener('click', function(e) {
    e.stopPropagation();
    sidebar.classList.contains('active') ? closeSidebar() : openSidebar();
  });

  if (closeBtn) closeBtn.addEventListener('click', closeSidebar);
  if (overlay) overlay.addEventListener('click', closeSidebar);

  // Fermer sur navigation
  sidebar.querySelectorAll('a').forEach(function(link) {
    link.addEventListener('click', closeSidebar);
  });

  // Escape key
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && sidebar.classList.contains('active')) closeSidebar();
  });

  // ── Active nav link ───────────────────────────────────────
  var current = window.location.pathname.split('/').pop() || 'index.html';
  sidebar.querySelectorAll('a[href]').forEach(function(a) {
    var href = a.getAttribute('href').replace(/^\//, '');
    if (href === current) {
      a.classList.add('active');
      a.setAttribute('aria-current', 'page');
    }
  });

  // ── Badge contexte desktop ────────────────────────────────
  var contextBadge = document.getElementById('header-context-badge');
  if (contextBadge) contextBadge.style.display = 'flex';

  // ── Session nav ───────────────────────────────────────────
  if (typeof Session !== 'undefined' && Session.updateNav) {
    Session.updateNav();
  } else {
    // Fallback sans session.js
    var user = null;
    try { user = JSON.parse(localStorage.getItem('batiswift_user') || 'null'); } catch(e) {}
    var guestDivs = document.querySelectorAll('.sidebar-guest');
    var userDivs  = document.querySelectorAll('.sidebar-user');
    if (user) {
      guestDivs.forEach(function(el) { el.style.display = 'none'; });
      userDivs.forEach(function(el) {
        el.style.display = 'flex';
        el.style.flexDirection = 'column';
        el.style.gap = '0.6rem';
      });
      var nomEl = document.getElementById('sidebar-user-nom');
      if (nomEl) nomEl.textContent = (user.nom || '').split(' ')[0] || 'Artisan';
    }
  }

  // ── Switcher mixte ────────────────────────────────────────
  var switchBtn = document.getElementById('btn-switch-context');
  if (switchBtn) {
    switchBtn.addEventListener('click', function(e) {
      e.preventDefault();
      if (typeof Session !== 'undefined' && Session.switchContext) {
        Session.switchContext();
      }
    });
  }

  // ── Logout ────────────────────────────────────────────────
  var logoutBtn = document.getElementById('sidebar-logout');
  if (logoutBtn) {
    logoutBtn.addEventListener('click', function() {
      if (typeof Session !== 'undefined' && Session.logout) {
        Session.logout();
      } else {
        localStorage.removeItem('batiswift_token');
        localStorage.removeItem('batiswift_user');
        localStorage.removeItem('batiswift_context');
        window.location.href = '/index.html';
      }
    });
  }

})();
</script>
