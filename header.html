<!-- ============================================================
     STYLES CRITIQUES (intégrés directement pour être sûrs)
     ============================================================ -->
<style>
/* ---- Reset local pour le header ---- */
.header-container {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  gap: 10px;
  flex-wrap: nowrap;
}

/* ---- Logo ---- */
.nav-logo {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font-display, 'Cormorant Garamond', serif);
  font-size: 1.3rem;
  font-weight: 700;
  color: var(--anthracite, #2B2B2B);
  text-decoration: none;
  flex-shrink: 0;
}
.logo-svg {
  width: 36px;
  height: auto;
  display: block;
}

/* ---- Actions (Connexion / Inscription) ---- */
.nav-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}
.nav-guest {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: nowrap;
}
.nav-guest .btn {
  white-space: nowrap;
  font-size: 0.8rem;
  padding: 6px 12px;
}
.nav-user {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: nowrap;
}
.nav-user .btn {
  white-space: nowrap;
  font-size: 0.75rem;
  padding: 4px 10px;
}
#nav-user-greeting {
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--anthracite, #2B2B2B);
  white-space: nowrap;
}

/* ---- Burger ---- */
.nav-hamburger {
  display: none;
  flex-direction: column;
  gap: 4px;
  background: none;
  border: none;
  cursor: pointer;
  padding: 4px;
  flex-shrink: 0;
}
.nav-hamburger .bar {
  width: 24px;
  height: 2.5px;
  background: var(--anthracite, #2B2B2B);
  border-radius: 4px;
  transition: all 0.3s ease;
}
.nav-hamburger.open .bar:nth-child(1) {
  transform: rotate(45deg) translate(5px, 5px);
}
.nav-hamburger.open .bar:nth-child(2) {
  opacity: 0;
}
.nav-hamburger.open .bar:nth-child(3) {
  transform: rotate(-45deg) translate(5px, -5px);
}

/* ---- Overlay ---- */
.sidebar-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 299;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}
.sidebar-overlay.active {
  opacity: 1;
  pointer-events: auto;
}

/* ---- Sidebar mobile ---- */
.mobile-sidebar {
  position: fixed;
  top: 0;
  right: -320px;
  width: 300px;
  max-width: 80vw;
  height: 100vh;
  background: #FFFFFF;
  z-index: 300;
  padding: 1.5rem;
  box-shadow: -4px 0 32px rgba(0,0,0,0.12);
  transition: right 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
  overflow-y: auto;
}
.mobile-sidebar.active {
  right: 0;
}
.sidebar-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: 1rem;
  border-bottom: 1px solid #EDE6DD;
}
.sidebar-close {
  background: none;
  border: none;
  font-size: 1.6rem;
  color: #8B8B8B;
  cursor: pointer;
  padding: 0 0.5rem;
}
.sidebar-close:hover {
  color: #2B2B2B;
}
.sidebar-nav {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}
.sidebar-nav a {
  padding: 0.8rem 1rem;
  border-radius: 14px;
  font-size: 1rem;
  font-weight: 500;
  color: #2B2B2B;
  transition: background 0.2s;
  text-decoration: none;
}
.sidebar-nav a:hover {
  background: #F5F0EB;
}
.sidebar-actions {
  margin-top: auto;
  display: flex;
  flex-direction: column;
  gap: 0.8rem;
  padding-top: 1rem;
  border-top: 1px solid #EDE6DD;
}
.sidebar-actions .btn {
  text-align: center;
  display: block;
  width: 100%;
}

/* ============================================================
   RESPONSIVE : CE QUI CHANGE SUR MOBILE
   ============================================================ */
@media (max-width: 768px) {
  /* 1. Le burger apparaît */
  .nav-hamburger {
    display: flex;
  }

  /* 2. Les boutons Connexion / Inscription sont RÉDUITS mais RESTENT VISIBLES */
  .nav-guest .btn {
    font-size: 0.65rem !important;
    padding: 4px 8px !important;
  }
  .nav-user .btn {
    font-size: 0.6rem !important;
    padding: 3px 6px !important;
  }
  #nav-user-greeting {
    font-size: 0.7rem !important;
  }

  /* 3. Le logo se réduit un peu */
  .nav-logo {
    font-size: 1.1rem;
  }
  .logo-svg {
    width: 28px;
  }
}

@media (min-width: 769px) {
  /* Sur desktop, la sidebar et l'overlay disparaissent */
  .sidebar-overlay,
  .mobile-sidebar {
    display: none !important;
  }
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
  // ─── SIDEBAR MOBILE ──────────────────────────────────────
  var burgerBtn = document.getElementById('burger-btn');
  var overlay = document.getElementById('sidebar-overlay');
  var sidebar = document.getElementById('mobile-sidebar');
  var closeBtn = document.getElementById('sidebar-close');
  var sidebarLinks = sidebar ? sidebar.querySelectorAll('a') : [];

  function openSidebar() {
    if (burgerBtn) burgerBtn.classList.add('open');
    if (overlay) overlay.classList.add('active');
    if (sidebar) sidebar.classList.add('active');
    document.body.style.overflow = 'hidden';
  }

  function closeSidebar() {
    if (burgerBtn) burgerBtn.classList.remove('open');
    if (overlay) overlay.classList.remove('active');
    if (sidebar) sidebar.classList.remove('active');
    document.body.style.overflow = '';
  }

  if (burgerBtn) burgerBtn.addEventListener('click', openSidebar);
  if (closeBtn) closeBtn.addEventListener('click', closeSidebar);
  if (overlay) overlay.addEventListener('click', closeSidebar);

  sidebarLinks.forEach(function(link) {
    link.addEventListener('click', closeSidebar);
  });

  // ─── GESTION DE SESSION ──────────────────────────────────
  var user = JSON.parse(localStorage.getItem('batiswift_user') || 'null');
  var guest = document.querySelector('.nav-guest');
  var userDiv = document.querySelector('.nav-user');
  var greeting = document.getElementById('nav-user-greeting');

  if (user && userDiv && guest) {
    guest.style.display = 'none';
    userDiv.style.display = 'flex';
    if (greeting) greeting.textContent = '👋 ' + user.nom;
  }

  // ─── DÉCONNEXION ─────────────────────────────────────────
  document.querySelector('[data-action="logout"]')?.addEventListener('click', function() {
    localStorage.removeItem('batiswift_token');
    localStorage.removeItem('batiswift_user');
    window.location.href = '/index.html';
  });
});
</script>
