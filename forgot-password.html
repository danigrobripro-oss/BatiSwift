<div id="header-container"></div>

  <div class="container" style="max-width:480px;margin:120px auto;padding:2rem;background:var(--blanc);border-radius:var(--radius-xl);box-shadow:0 8px 48px rgba(43,43,43,.10);">
    <h1 style="font-family:var(--font-display);font-size:1.8rem;"><svg class="bs-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#ic-mail"/></svg> Mot de passe oublié</h1>
    <p style="color:var(--gris);">Saisissez votre email, nous vous enverrons un lien pour le réinitialiser.</p>

    <div id="alert" class="alert" style="display:none;"></div>

    <form id="forgot-form">
      <div class="form-group">
        <label class="form-label" for="email">Email professionnel</label>
        <input type="email" id="email" class="form-control" placeholder="vous@exemple.fr" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Envoyer le lien</button>
    </form>

    <p style="margin-top:1.5rem;text-align:center;font-size:0.85rem;color:var(--gris);">
      <a href="/connexion.html">← Retour à la connexion</a>
    </p>
  </div>

<div id="footer-container"></div>

<script src="/js/config.js"></script>
<script src="/js/api.js"></script>
<script src="/js/session.js"></script>
<script src="/js/main.js"></script>

<script>
document.getElementById('forgot-form').addEventListener('submit', async function(e) {
  e.preventDefault();
  
  const form = e.currentTarget;
  const alertEl = document.getElementById('alert');
  const emailInput = document.getElementById('email');
  const button = form.querySelector('button[type="submit"]');

  alertEl.style.display = 'none';

  const email = emailInput.value.trim().toLowerCase();

  if (!email) {
    alertEl.textContent = 'Veuillez saisir votre email.';
    alertEl.className = 'alert alert-danger';
    alertEl.style.display = 'block';
    return;
  }

  button.disabled = true;
  button.textContent = 'Envoi en cours...';

  try {
    const response = await fetch(
      'https://agent-btp.onrender.com/api/forgot-password',
      {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ email })
      }
    );

    let data = {};

    try {
      data = await response.json();
    } catch (_) {
      data = {};
    }

    if (!response.ok) {
      throw new Error(
        data.error || 'Une erreur est survenue.'
      );
    }

    if (data.success) {
      alertEl.innerHTML = bsIcon('ic-check', 16) + ' Si cet email existe, vous recevrez un lien de réinitialisation dans quelques minutes.';

      alertEl.className = 'alert alert-success';
      alertEl.style.display = 'block';

      emailInput.value = '';
    } else {
      alertEl.innerHTML = bsIcon('ic-error', 16) + ' ' + (data.error || 'Une erreur est survenue.');

      alertEl.className = 'alert alert-danger';
      alertEl.style.display = 'block';
    }

  } catch (err) {

    console.error('Forgot password:', err);

    alertEl.innerHTML = bsIcon('ic-error', 16) + ' Impossible de contacter le serveur. Veuillez réessayer.';

    alertEl.className = 'alert alert-danger';
    alertEl.style.display = 'block';

  } finally {
    button.disabled = false;
    button.textContent = 'Envoyer le lien';
  }
});
</script>
