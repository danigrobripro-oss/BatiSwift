<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mot de passe oublié – BâtiSwift</title>

  <!-- ─── FAVICON ─── -->
  <link rel="icon" href="/assets/favicon.ico" type="image/x-icon" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png" />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon-v2.svg">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon-v2.svg" />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon-v2.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />
  <link rel="manifest" href="/assets/site.webmanifest" />
  <meta name="theme-color" content="#F5F0EB" />

  <link rel="stylesheet" href="/css/style.css">
</head>
<body></body>

<div id="page-loader" class="page-loader"><div class="spinner spinner-dark"></div></div>
<div id="header-container"></div>

  <div class="container" style="max-width:480px;margin:120px auto;padding:2rem;background:var(--blanc);border-radius:var(--radius-xl);box-shadow:0 8px 48px rgba(43,43,43,.10);">
    <h1 style="font-family:var(--font-display);font-size:1.8rem;">📧 Mot de passe oublié</h1>
    <p style="color:var(--gris);">Saisissez votre email, nous vous enverrons un lien pour le réinitialiser.</p>

    <div id="alert" class="alert" style="display:none;"></div>

    <form id="forgot-form">
      <div class="form-group">
        <label class="form-label" for="email">Email professionnel</label>
        <input type="email" id="email" class="form-control" placeholder="vous@exemple.fr" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Envoyer le lien</button>
    </form>

    <p style="margin-top:1.5rem;text-align:center;font-size:0.85rem;color:var(--gris);">
      <a href="/connexion.html">← Retour à la connexion</a>
    </p>
  </div>

<div id="footer-container"></div>

<script src="/js/config.js"></script>
<script src="/js/api.js"></script>
<script src="/js/session.js"></script>
<script src="/js/main.js"></script>

<script>
document.getElementById('forgot-form').addEventListener('submit', async function(e) {
  e.preventDefault();
  
  const form = e.currentTarget;
  const alertEl = document.getElementById('alert');
  const emailInput = document.getElementById('email');
  const button = form.querySelector('button[type="submit"]');

  alertEl.style.display = 'none';

  const email = emailInput.value.trim().toLowerCase();

  if (!email) {
    alertEl.textContent = 'Veuillez saisir votre email.';
    alertEl.className = 'alert alert-danger';
    alertEl.style.display = 'block';
    return;
  }

  button.disabled = true;
  button.textContent = 'Envoi en cours...';

  try {
    const response = await fetch(
      'https://agent-btp.onrender.com/api/forgot-password',
      {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ email })
      }
    );

    let data = {};

    try {
      data = await response.json();
    } catch (_) {
      data = {};
    }

    if (!response.ok) {
      throw new Error(
        data.error || 'Une erreur est survenue.'
      );
    }

    if (data.success) {
      alertEl.textContent =
        '✅ Si cet email existe, vous recevrez un lien de réinitialisation dans quelques minutes.';

      alertEl.className = 'alert alert-success';
      alertEl.style.display = 'block';

      emailInput.value = '';
    } else {
      alertEl.textContent =
        '❌ ' + (data.error || 'Une erreur est survenue.');

      alertEl.className = 'alert alert-danger';
      alertEl.style.display = 'block';
    }

  } catch (err) {

    console.error('Forgot password:', err);

    alertEl.textContent =
      '❌ Impossible de contacter le serveur. Veuillez réessayer.';

    alertEl.className = 'alert alert-danger';
    alertEl.style.display = 'block';

  } finally {
    button.disabled = false;
    button.textContent = 'Envoyer le lien';
  }
});
</script>
</body>
</html>
