<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Réinitialiser mon mot de passe – BâtiSwift</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="container" style="max-width:480px;margin:120px auto;padding:2rem;background:var(--blanc);border-radius:var(--radius-xl);box-shadow:0 8px 48px rgba(43,43,43,.10);">
    <h1 style="font-family:var(--font-display);font-size:1.8rem;">🔐 Nouveau mot de passe</h1>
    <p style="color:var(--gris);">Entrez votre nouveau mot de passe (6 caractères minimum).</p>

    <div id="alert" class="alert" style="display:none;"></div>

    <form id="reset-form">
      <div class="form-group">
        <label class="form-label" for="password">Nouveau mot de passe</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="password-confirm">Confirmer</label>
        <input type="password" id="password-confirm" class="form-control" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Réinitialiser</button>
    </form>

    <p style="margin-top:1.5rem;text-align:center;font-size:0.85rem;color:var(--gris);">
      <a href="/connexion.html">← Retour à la connexion</a>
    </p>
  </div>

  <script>
  document.getElementById('reset-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const alertEl = document.getElementById('alert');
    alertEl.style.display = 'none';

    const pw = document.getElementById('password').value;
    const pw2 = document.getElementById('password-confirm').value;

    if (pw.length < 6) {
      alertEl.textContent = 'Le mot de passe doit contenir au moins 6 caractères.';
      alertEl.className = 'alert alert-danger';
      alertEl.style.display = 'block';
      return;
    }
    if (pw !== pw2) {
      alertEl.textContent = 'Les mots de passe ne correspondent pas.';
      alertEl.className = 'alert alert-danger';
      alertEl.style.display = 'block';
      return;
    }

    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    if (!token) {
      alertEl.textContent = 'Token de réinitialisation manquant.';
      alertEl.className = 'alert alert-danger';
      alertEl.style.display = 'block';
      return;
    }

    try {
      const response = await fetch('https://agent-btp.onrender.com/api/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, password: pw })
      });
      const data = await response.json();

      if (data.success) {
        alertEl.textContent = '✅ Mot de passe réinitialisé avec succès. Vous allez être redirigé.';
        alertEl.className = 'alert alert-success';
        alertEl.style.display = 'block';
        setTimeout(() => { window.location.href = '/connexion.html'; }, 3000);
      } else {
        alertEl.textContent = '❌ ' + (data.error || 'Erreur inconnue.');
        alertEl.className = 'alert alert-danger';
        alertEl.style.display = 'block';
      }
    } catch (err) {
      alertEl.textContent = '❌ Erreur de connexion au serveur.';
      alertEl.className = 'alert alert-danger';
      alertEl.style.display = 'block';
    }
  });
  </script>
</body>
</html>
