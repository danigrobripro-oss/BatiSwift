services:
  - type: web
    name: batiswift-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn agent:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: CLAUDE_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: INFOBIP_API_KEY
        sync: false
      - key: INFOBIP_BASE_URL
        value: https://api.infobip.com
      - key: FRONTEND_URL
        sync: false