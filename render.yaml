services:
  - type: web
    name: batiswift-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn agent:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false                  # À définir avec l’URL PostgreSQL Render
      - key: GEMINI_API_KEY
        sync: false                  # Google AI Studio
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: INFOBIP_API_KEY
        sync: false
      - key: INFOBIP_BASE_URL
        value: https://api.infobip.com
      - key: BREVO_API_KEY
        sync: false                  # Brevo (Sendinblue)
      - key: BREVO_SENDER_EMAIL
        sync: false                  # contact@batiswift.com
      - key: BREVO_SENDER_NAME
        value: BâtiSwift
      - key: DEEPL_API_KEY
        sync: false                  # DeepL (optionnel pour Pro)
      - key: FRONTEND_URL
        sync: false                  # https://batiswift.onrender.com