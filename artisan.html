<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BâtiSwift – Espace Artisan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
  <!-- Stripe.js (chargé pour les paiements) -->
  <script src="https://js.stripe.com/v3/"></script>
</head>
<body>
  <!-- ===== HEADER ===== -->
  <header>
    <div class="container">
      <div class="logo">
        <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="40" height="40" rx="8" fill="#2B2B2B" />
          <path d="M12 14L20 22L28 14" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M12 22L20 30L28 22" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span>BâtiSwift</span>
      </div>
      <nav class="nav-links">
        <a href="index.html">Accueil</a>
        <button id="logout-btn" class="btn-ghost btn-sm hidden">Déconnexion</button>
      </nav>
    </div>
  </header>

  <!-- ===== CONTENU ===== -->
  <div class="container">

    <!-- SECTION LOGIN -->
    <div id="login-section" class="form-card glass">
      <h2>Connexion</h2>
      <form id="login-form">
        <div class="form-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" name="email" placeholder="votre@email.com" required />
        </div>
        <div class="form-group">
          <label for="login-password">Mot de passe</label>
          <input type="password" id="login-password" name="password" placeholder="••••••••" required />
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-primary">Se connecter</button>
        </div>
        <div class="form-switch">
          Pas encore de compte ? <a id="show-register">Créer un compte</a>
        </div>
      </form>
    </div>

    <!-- SECTION INSCRIPTION -->
    <div id="register-section" class="form-card glass hidden">
      <h2>Inscription</h2>
      <form id="register-form">
        <div class="form-group">
          <label for="register-nom">Nom complet</label>
          <input type="text" id="register-nom" name="nom" placeholder="Jean Dupont" required />
        </div>
        <div class="form-group">
          <label for="register-email">Email</label>
          <input type="email" id="register-email" name="email" placeholder="votre@email.com" required />
        </div>
        <div class="form-group">
          <label for="register-telephone">Téléphone</label>
          <input type="tel" id="register-telephone" name="telephone" placeholder="0600000000" required />
        </div>
        <div class="form-group">
          <label for="register-password">Mot de passe</label>
          <input type="password" id="register-password" name="password" placeholder="••••••••" required />
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-secondary">S'inscrire</button>
        </div>
        <div class="form-switch">
          Déjà inscrit ? <a id="show-login">Se connecter</a>
        </div>
      </form>
    </div>

    <!-- SECTION DASHBOARD -->
    <div id="dashboard-section" class="hidden">
      <h2 style="margin-top: var(--spacing-md);">Tableau de bord</h2>
      <p>Bienvenue, <span id="user-name">Artisan</span> !</p>
      <h3 style="margin-top: var(--spacing-md);">Leads disponibles</h3>
      <div id="leads-container" class="leads-grid">
        <!-- Sera rempli par JavaScript -->
      </div>
    </div>

  </div>

  <!-- ===== FOOTER ===== -->
  <footer>
    <div class="container">
      <p>© 2026 BâtiSwift – <a href="artisan.html">Espace Artisan</a></p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
