<body>

    </div>
    <nav class="nav-links">
      <a href="index.html">Accueil</a>
      <a href="client.html">Déposer une demande</a>
      <a href="#" id="logout-link" style="display:none;">Déconnexion</a>
    </nav>
  </header>

  <main style="max-width: 900px; margin: 2rem auto; padding: 0 1rem;">
    <!-- Bloc connexion / inscription (masqué si connecté) -->
    <div id="auth-section" class="glass-card" style="margin-bottom: 2rem;">
      <h2>Connexion</h2>
      <form id="login-form">
        <input type="email" id="login-email" placeholder="Email" required>
        <input type="password" id="login-password" placeholder="Mot de passe" required>
        <div id="login-error" class="error-msg"></div>
        <button type="submit" class="btn-primary">Se connecter</button>
      </form>
      <hr style="margin: 1.5rem 0;">
      <h2>Inscription</h2>
      <form id="register-form">
        <input type="text" id="reg-nom" placeholder="Nom complet" required>
        <input type="email" id="reg-email" placeholder="Email" required>
        <input type="password" id="reg-password" placeholder="Mot de passe" required>
        <input type="tel" id="reg-tel" placeholder="Téléphone">
        <input type="text" id="reg-ville" placeholder="Ville">
        <input type="number" id="reg-rayon" placeholder="Rayon (km)" value="30" min="1">
        <div id="register-error" class="error-msg"></div>
        <button type="submit" class="btn-primary">Créer mon compte</button>
      </form>
    </div>

    <!-- Bloc dashboard (visible uniquement si connecté) -->
    <div id="dashboard-section" style="display:none;">
      <h2>Bienvenue, <span id="artisan-nom"></span></h2>
      <p>Ville : <span id="artisan-ville"></span> | Rayon : <span id="artisan-rayon"></span> km</p>
      <div id="leads-container"></div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
