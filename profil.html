<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Mon profil — BâtiSwift</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .profile-card {
      max-width: 560px;
      margin: 2rem auto;
      background: var(--bg-glass);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 2.5rem;
      backdrop-filter: blur(16px);
    }
    .profile-card h1 { font-size: 1.8rem; margin-bottom: 0.5rem; }
    .profile-card .sub { color: var(--text-muted); margin-bottom: 1.5rem; }
    .form-group { margin-bottom: 1.2rem; }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.3rem;
      font-size: 0.9rem;
      color: var(--text);
    }
    input {
      width: 100%;
      padding: 0.7rem 1rem;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-family: inherit;
      background: var(--bg-glass);
      backdrop-filter: blur(8px);
      color: var(--text);
    }
    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 20px var(--accent-glow);
    }
  </style>
  <script>
    (function () {
      var t = localStorage.getItem("batiswift-theme");
      if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches)) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>
</head>
<body>
  <div id="header-placeholder"></div>

  <main class="container">
    <div class="profile-card">
      <h1>👤 Mon profil</h1>
      <p class="sub">Consultez et modifiez vos informations personnelles.</p>

      <form id="profile-form">
        <div class="form-group">
          <label>Nom / raison sociale</label>
          <input type="text" id="prof-name" placeholder="SARAS Plomberie" />
        </div>
        <div class="form-group">
          <label>Email professionnel</label>
          <input type="email" id="prof-email" placeholder="contact@artisan.fr" readonly />
        </div>
        <div class="form-group">
          <label>Téléphone</label>
          <input type="tel" id="prof-phone" placeholder="0612345678" />
        </div>
        <div class="form-group">
          <label>Métier principal</label>
          <input type="text" id="prof-trade" placeholder="Plomberie" />
        </div>
        <div class="form-group">
          <label>Zone d’intervention</label>
          <input type="text" id="prof-zone" placeholder="Lyon, 69003" />
        </div>
        <button type="submit" class="btn btn--primary btn--block">💾 Enregistrer les modifications</button>
        <div id="profile-status" style="margin-top:0.5rem;color:var(--text-muted);"></div>
      </form>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script>
    const API_BASE = "https://agent-btp.onrender.com";
    const TOKEN_KEY = "batiswift-artisan-token";
    const token = localStorage.getItem(TOKEN_KEY);

    if (!token) {
      window.location.href = "inscription.html";
    }

    async function loadProfile() {
      try {
        const res = await fetch(`${API_BASE}/api/artisan/me?token=${token}`);
        if (!res.ok) throw new Error('Erreur');
        const data = await res.json();
        document.getElementById('prof-name').value = data.name || '';
        document.getElementById('prof-email').value = data.email || '';
        document.getElementById('prof-phone').value = data.phone || '';
        document.getElementById('prof-trade').value = data.trade || '';
        document.getElementById('prof-zone').value = (data.zones || []).join(', ');
      } catch (e) {
        console.error('Erreur chargement profil', e);
      }
    }

    document.getElementById('profile-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const name = document.getElementById('prof-name').value.trim();
      const phone = document.getElementById('prof-phone').value.trim();
      const trade = document.getElementById('prof-trade').value.trim();
      const zone = document.getElementById('prof-zone').value.trim();
      const zones = zone.split(',').map(s => s.trim()).filter(Boolean);

      try {
        const res = await fetch(`${API_BASE}/api/artisan/settings?token=${token}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone, name, trade, zones })
        });
        if (!res.ok) throw new Error('Erreur');
        document.getElementById('profile-status').textContent = '✅ Profil mis à jour !';
        document.getElementById('profile-status').style.color = '#2ecc71';
      } catch (e) {
        document.getElementById('profile-status').textContent = '❌ Erreur : ' + e.message;
        document.getElementById('profile-status').style.color = '#ff2d7a';
      }
    });

    loadProfile();

    fetch('header.html').then(r => r.text()).then(html => {
      document.getElementById('header-placeholder').innerHTML = html;
    });
    fetch('footer.html').then(r => r.text()).then(html => {
      document.getElementById('footer-placeholder').innerHTML = html;
    });
  </script>
</body>
</html>
