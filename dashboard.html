<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tableau de bord – BâtiSwift</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://js.stripe.com/v3/"></script>
</head>
<body>
  <div id="page-loader" class="page-loader"><div class="spinner spinner-dark" style="width:40px; height:40px;"></div></div>
  <header>
    <div class="container">
      <a href="index.html" class="nav-logo"><img src="assets/logo.svg" alt="BâtiSwift" class="logo-svg"> BâtiSwift</a>
      <nav>
        <ul class="nav-links">
          <li><a href="index.html">Accueil</a></li>
          <li><a href="#" id="nav-username"></a></li>
        </ul>
      </nav>
      <div class="nav-actions">
        <button id="btn-logout" class="btn btn-secondary btn-sm">Déconnexion</button>
      </div>
    </div>
  </header>

  <main>
    <section class="section-sm" style="padding-top: 100px;">
      <div class="container">
        <h2 class="reveal">Leads disponibles</h2>
        <div id="available-leads" class="grid-3 mt-md"></div>
        
        <h2 class="mt-xl reveal">Mes leads achetés</h2>
        <div id="purchased-leads" class="grid-2 mt-md"></div>
      </div>
    </section>
  </main>

  <footer>
    <div class="container">
      <div class="footer-grid">
        <div class="footer-brand">
          <a href="index.html" class="nav-logo">BâtiSwift</a>
          <p>Place de marché inversée pour artisans du BTP.</p>
        </div>
        <div class="footer-col">
          <h4>Navigation</h4>
          <a href="index.html">Accueil</a>
          <a href="client.html">Déposer une demande</a>
        </div>
        <div class="footer-col">
          <h4>Artisans</h4>
          <a href="connexion.html">Connexion</a>
          <a href="inscription.html">Inscription</a>
        </div>
        <div class="footer-col">
          <h4>Légal</h4>
          <a href="mentions-legales.html">Mentions légales</a>
          <a href="cgu.html">CGU</a>
        </div>
      </div>
      <div class="footer-bottom">
        <span>© 2024 BâtiSwift</span>
        <a href="mentions-legales.html">Mentions légales</a>
      </div>
    </div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
  <script src="js/session.js"></script>
  <script src="js/artisan.js"></script>
  <script>
    (async function() {
      await requireAuth();   // ← redirige vers connexion.html si pas connecté
      document.getElementById('nav-username').textContent = currentUser.nom;
      document.getElementById('btn-logout').addEventListener('click', logout);
      loadArtisanLeads();
    })();
  </script>
</body>
</html>
