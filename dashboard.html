<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tableau de bord – BâtiSwift</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://js.stripe.com/v3/"></script>
</head>
<body>
  <div id="page-loader" class="page-loader"><div class="spinner spinner-dark" style="width:40px; height:40px;"></div></div>
  <header>
    <div class="container">
      <a href="index.html" class="nav-logo"><img src="assets/logo.svg" alt="BâtiSwift" class="logo-svg"> BâtiSwift</a>
      <nav>
        <ul class="nav-links">
          <li><a href="index.html">Accueil</a></li>
          <li><a href="#" id="nav-username"></a></li>
        </ul>
      </nav>
      <div class="nav-actions">
        <button id="btn-logout" class="btn btn-secondary btn-sm">Déconnexion</button>
      </div>
    </div>
  </header>

  <main>
    <section class="section-sm" style="padding-top: 100px;">
      <div class="container">
        <h2 class="reveal">Leads disponibles</h2>
        <div id="available-leads" class="grid-3 mt-md"></div>
        
        <h2 class="mt-xl reveal">Mes leads achetés</h2>
        <div id="purchased-leads" class="grid-2 mt-md"></div>
      </div>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
  <script src="js/session.js"></script>
  <script src="js/artisan.js"></script>
  <script>
    (async function() {
      await checkSession();
      if (!currentUser) {
        window.location.href = 'connexion.html';
        return;
      }
      document.getElementById('nav-username').textContent = currentUser.nom || 'Artisan';
      document.getElementById('btn-logout').addEventListener('click', logout);
      loadArtisanLeads();
    })();
  </script>
</body>
</html>
