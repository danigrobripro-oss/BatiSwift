<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tableau de bord – BâtiSwift</title>

  <!-- ─── FAVICON ─── -->
  <link rel="icon" href="/assets/favicon.ico" type="image/x-icon" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png" />
<link rel="icon" type="image/svg+xml" href="/assets/favicon-v2.svg">
<link rel="icon" type="image/svg+xml" href="/assets/favicon-v2.svg" />
<link rel="icon" type="image/svg+xml" href="/assets/favicon-v2.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />
  <link rel="manifest" href="/assets/site.webmanifest" />
  <meta name="theme-color" content="#F5F0EB" />

  <link rel="stylesheet" href="/css/style.css">
  <script src="https://js.stripe.com/v3/"></script>
  <style>
    /* ── DASHBOARD SPECIFIQUE ── */
    .dashboard-hero {
      padding-top: calc(var(--header-h) + 40px);
      padding-bottom: var(--space-lg);
      background: var(--beige);
      border-bottom: 1px solid var(--beige-dark);
    }
    .dashboard-hero h1 {
      font-family: var(--font-display);
      font-size: 2rem;
      font-weight: 700;
    }
    .dashboard-hero .sub {
      color: var(--gris);
      font-size: 0.95rem;
    }
    
    .lead-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: var(--space-lg);
    }
    
    .lead-card {
      background: var(--blanc);
      border-radius: var(--radius-lg);
      padding: var(--space-lg);
      border: 1.5px solid var(--beige-dark);
      transition: all var(--transition);
    }
    .lead-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 32px rgba(43,43,43,0.08);
      border-color: var(--gris-light);
    }
    .lead-card .badge {
      float: right;
    }
    .lead-card .price {
      font-family: var(--font-display);
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--or);
    }
    .lead-card .distance {
      font-size: 0.85rem;
      color: var(--gris);
    }
    .lead-card .description {
      font-size: 0.9rem;
      color: var(--gris);
      margin: var(--space-sm) 0;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .lead-card .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: var(--space-sm);
      padding-top: var(--space-sm);
      border-top: 1px solid var(--beige-dark);
    }
    
    .empty-state {
      text-align: center;
      padding: var(--space-xl) 0;
      color: var(--gris);
    }
    .empty-state .icon {
      font-size: 3rem;
      margin-bottom: var(--space-md);
    }

    /* ── SECTION AVIS ── */
    .avis-section {
      margin-top: 2.5rem;
      padding-top: 1.5rem;
      border-top: 2px solid var(--beige-dark);
    }
    .avis-section h3 {
      font-family: var(--font-display);
      font-size: 1.4rem;
    }
    .avis-card {
      background: var(--beige);
      border-radius: var(--radius);
      padding: 1rem;
      margin-bottom: 0.8rem;
    }
    .avis-card .stars {
      color: var(--or);
      font-size: 1rem;
    }
    .avis-card .client {
      font-weight: 600;
      color: var(--anthracite);
    }
    .avis-card .comment {
      font-size: 0.9rem;
      color: var(--gris);
      margin-top: 4px;
    }
    .avis-card .date {
      font-size: 0.7rem;
      color: var(--gris-light);
    }
    
    /* ── Mode mixte : boutons de dépot ── */
    .mixed-actions {
      display: flex;
      gap: 0.8rem;
      flex-wrap: wrap;
    }
    .mixed-actions .btn {
      white-space: nowrap;
    }
    
    @media (max-width: 768px) {
      .dashboard-hero h1 {
        font-size: 1.6rem;
      }
      .lead-grid {
        grid-template-columns: 1fr;
      }
      .lead-card {
        padding: var(--space-md);
      }
      .mixed-actions {
        flex-direction: column;
      }
    }
    
    @media (max-width: 480px) {
      .dashboard-hero {
        padding-top: calc(var(--header-h) + 20px);
        padding-bottom: var(--space-md);
      }
      .dashboard-hero h1 {
        font-size: 1.3rem;
      }
      .lead-card .price {
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>

<div id="page-loader" class="page-loader"><div class="spinner spinner-dark" style="width:40px;height:40px;"></div></div>
<div id="header-container"></div>

<main>
  <!-- ── HERO DASHBOARD ── -->
  <section class="dashboard-hero">
    <div class="container">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:15px;">
        <div>
          <h1>👋 Tableau de bord</h1>
          <p class="sub">Bienvenue, <span id="nav-username" style="font-weight:600;color:var(--anthracite);">—</span></p>
          <p style="margin-top:6px;font-size:0.85rem;color:var(--gris);">
            🔨 Espace artisan · Vous pouvez aussi <strong>déposer une demande</strong> (chantier, recherche de sous-traitant) ci-dessous.
          </p>
        </div>
        <div class="mixed-actions">
          <a href="/client.html" class="btn btn-gold btn-sm">✍️ Déposer une demande</a>
          <a href="/stripe.html" class="btn btn-secondary btn-sm">💳 Connexion Stripe</a>
          <a href="/parametres.html" class="btn btn-secondary btn-sm">⚙ Paramètres</a>
        </div>
      </div>
    </div>
  </section>

  <!-- ── LEADS ── -->
  <section class="section-sm">
    <div class="container">
      <h2 class="reveal" style="font-size:1.4rem;">📋 Leads disponibles</h2>
      <div id="available-leads" class="lead-grid mt-md"></div>
      
      <h2 class="mt-xl reveal" style="font-size:1.4rem;">✅ Mes leads achetés</h2>
      <div id="purchased-leads" class="lead-grid mt-md"></div>

      <!-- ─── SECTION AVIS ─── -->
      <div class="avis-section" id="avis-section">
        <h3>⭐ Mes avis</h3>
        <div id="avis-container">
          <p style="color:var(--gris);">Chargement des avis…</p>
        </div>
      </div>
    </div>
  </section>
</main>

<div id="footer-container"></div>

<script src="/js/config.js"></script>
<script src="/js/api.js"></script>
<script src="/js/session.js"></script>
<script src="/js/main.js"></script>
<script src="/js/artisan.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
  // ─── AUTH ──────────────────────────────────────────────────
  if (typeof requireAuth === 'function') {
    requireAuth();
  }
  
  const user = JSON.parse(localStorage.getItem(CONFIG.USER_KEY) || 'null');
  const usernameEl = document.getElementById('nav-username');
  if (user && usernameEl) {
    usernameEl.textContent = user.nom || 'Artisan';
  }
  
  // ─── LEADS ─────────────────────────────────────────────────
  if (typeof loadArtisanLeads === 'function') {
    loadArtisanLeads();
  }

  // ─── AVIS ──────────────────────────────────────────────────
  function loadAvis() {
    const container = document.getElementById('avis-container');
    const token = localStorage.getItem(CONFIG.TOKEN_KEY);
    if (!token) {
      container.innerHTML = '<p style="color:var(--gris);">Connectez-vous pour voir vos avis.</p>';
      return;
    }

    fetch(`${CONFIG.API_URL}/api/artisan/avis`, {
      headers: { 'Authorization': 'Bearer ' + token }
    })
    .then(r => r.json())
    .then(data => {
      if (!data.avis || data.avis.length === 0) {
        container.innerHTML = '<p style="color:var(--gris);">Aucun avis pour le moment.</p>';
        return;
      }
      let html = `<p style="font-weight:600;">⭐ Note moyenne : ${data.moyenne || '—'} / 5 (${data.total} avis)</p>`;
      html += '<div style="display:flex;flex-direction:column;gap:0.8rem;margin-top:0.8rem;">';
      data.avis.forEach(a => {
        const stars = '⭐'.repeat(a.note) + '☆'.repeat(5 - a.note);
        html += `<div class="avis-card">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <span class="client">${a.client_nom || 'Anonyme'}</span>
            <span class="stars">${stars}</span>
          </div>
          ${a.commentaire ? `<p class="comment">${a.commentaire}</p>` : ''}
          <small class="date">${new Date(a.date).toLocaleDateString()}</small>
        </div>`;
      });
      html += '</div>';
      container.innerHTML = html;
    })
    .catch(() => {
      container.innerHTML = '<p style="color:var(--gris);">Erreur chargement des avis.</p>';
    });
  }

  // Charger les avis après un court délai (attendre que le dashboard soit prêt)
  setTimeout(loadAvis, 500);
});
</script>

</body>
</html>
