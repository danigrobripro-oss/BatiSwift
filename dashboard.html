<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tableau de bord – BâtiSwift</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://js.stripe.com/v3/"></script>
  <style>
    /* ── DASHBOARD SPECIFIQUE ── */
    .dashboard-hero {
      padding-top: calc(var(--header-h) + 40px);
      padding-bottom: var(--space-lg);
      background: var(--beige);
      border-bottom: 1px solid var(--beige-dark);
    }
    .dashboard-hero h1 {
      font-family: var(--font-display);
      font-size: 2rem;
      font-weight: 700;
    }
    .dashboard-hero .sub {
      color: var(--gris);
      font-size: 0.95rem;
    }
    
    .lead-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: var(--space-lg);
    }
    
    .lead-card {
      background: var(--blanc);
      border-radius: var(--radius-lg);
      padding: var(--space-lg);
      border: 1.5px solid var(--beige-dark);
      transition: all var(--transition);
    }
    .lead-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 32px rgba(43,43,43,0.08);
      border-color: var(--gris-light);
    }
    .lead-card .badge {
      float: right;
    }
    .lead-card .price {
      font-family: var(--font-display);
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--or);
    }
    .lead-card .distance {
      font-size: 0.85rem;
      color: var(--gris);
    }
    .lead-card .description {
      font-size: 0.9rem;
      color: var(--gris);
      margin: var(--space-sm) 0;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .lead-card .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: var(--space-sm);
      padding-top: var(--space-sm);
      border-top: 1px solid var(--beige-dark);
    }
    
    .empty-state {
      text-align: center;
      padding: var(--space-xl) 0;
      color: var(--gris);
    }
    .empty-state .icon {
      font-size: 3rem;
      margin-bottom: var(--space-md);
    }
    
    @media (max-width: 768px) {
      .dashboard-hero h1 {
        font-size: 1.6rem;
      }
      .lead-grid {
        grid-template-columns: 1fr;
      }
      .lead-card {
        padding: var(--space-md);
      }
    }
    
    @media (max-width: 480px) {
      .dashboard-hero {
        padding-top: calc(var(--header-h) + 20px);
        padding-bottom: var(--space-md);
      }
      .dashboard-hero h1 {
        font-size: 1.3rem;
      }
      .lead-card .price {
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>

<div id="page-loader" class="page-loader"><div class="spinner spinner-dark" style="width:40px;height:40px;"></div></div>
<div id="header-container"></div>

<main>
  <!-- ── HERO DASHBOARD ── -->
  <section class="dashboard-hero">
    <div class="container">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
        <div>
          <h1>👋 Tableau de bord</h1>
          <p class="sub">Bienvenue, <span id="nav-username" style="font-weight:600;color:var(--anthracite);">—</span></p>
        </div>
        <a href="/parametres.html" class="btn btn-secondary btn-sm">⚙ Paramètres</a>
      </div>
    </div>
  </section>

  <!-- ── LEADS ── -->
  <section class="section-sm">
    <div class="container">
      <h2 class="reveal" style="font-size:1.4rem;">📋 Leads disponibles</h2>
      <div id="available-leads" class="lead-grid mt-md"></div>
      
      <h2 class="mt-xl reveal" style="font-size:1.4rem;">✅ Mes leads achetés</h2>
      <div id="purchased-leads" class="lead-grid mt-md"></div>
    </div>
  </section>
</main>

<div id="footer-container"></div>

<script src="/js/config.js"></script>
<script src="/js/api.js"></script>
<script src="/js/session.js"></script>
<script src="/js/main.js"></script>
<script src="/js/artisan.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
  // Initialiser la session
  if (typeof requireAuth === 'function') {
    requireAuth();
  }
  
  // Afficher le nom de l'utilisateur
  const user = JSON.parse(localStorage.getItem(CONFIG.USER_KEY) || 'null');
  const usernameEl = document.getElementById('nav-username');
  if (user && usernameEl) {
    usernameEl.textContent = user.nom || 'Artisan';
  }
  
  // Charger les leads
  if (typeof loadArtisanLeads === 'function') {
    loadArtisanLeads();
  }
});
</script>

</body>
</html>
