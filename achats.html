<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Mes achats — BâtiSwift</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .lead-item {
      background: var(--bg-glass);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.2rem;
      margin-bottom: 1rem;
      backdrop-filter: blur(8px);
    }
    .dashboard-sidebar {
      width: 220px;
      flex-shrink: 0;
      background: var(--bg-glass);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
    }
    .dashboard-sidebar a {
      display: block;
      padding: 0.6rem 0.8rem;
      border-radius: 10px;
      color: var(--text-muted);
      text-decoration: none;
      margin-bottom: 0.3rem;
    }
    .dashboard-sidebar a:hover,
    .dashboard-sidebar a.active {
      background: rgba(255, 0, 127, 0.08);
      color: var(--accent);
    }
    .dashboard-layout {
      display: flex;
      gap: 1.5rem;
      padding: 2rem 0;
      flex-wrap: wrap;
    }
    .dashboard-main { flex: 1; }
  </style>
  <script>
    (function () {
      var t = localStorage.getItem("batiswift-theme");
      if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches)) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>
</head>
<body>
  <div id="header-placeholder"></div>

  <main class="container">
    <div class="dashboard-layout">
      <aside class="dashboard-sidebar">
        <h3 style="margin-bottom:1.5rem;font-size:0.9rem;color:var(--text-muted);">📋 Menu</h3>
        <a href="leads.html">🔥 Leads disponibles</a>
        <a href="achats.html" class="active">📦 Mes achats</a>
        <a href="parametres.html">⚙️ Paramètres</a>
        <a href="artisan-home.html" style="margin-top:1rem;border-top:1px solid var(--border);padding-top:1rem;">🚪 Retour espace pro</a>
      </aside>

      <div class="dashboard-main">
        <h2 style="font-size:1.4rem;margin-bottom:1rem;">📦 Mes achats</h2>
        <p style="color:var(--text-muted);margin-bottom:1rem;">Historique de vos achats de leads.</p>
        <div id="achats-list">
          <p style="color:var(--text-muted);">Chargement...</p>
        </div>
      </div>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script>
    const API_BASE = "https://agent-btp.onrender.com";
    const params = new URLSearchParams(window.location.search);
    let token = params.get("token") || localStorage.getItem("batiswift-artisan-token");
    const TOKEN_KEY = "batiswift-artisan-token";

    if (!token) {
      window.location.href = "inscription.html";
    }

    function api(path, options = {}) {
      var url = API_BASE + path;
      if (token) {
        var sep = url.indexOf('?') === -1 ? '?' : '&';
        url += sep + 'token=' + encodeURIComponent(token);
      }
      return fetch(url, {
        method: options.method || 'GET',
        headers: { "Content-Type": "application/json" },
        body: options.body || null
      }).then(async function (r) {
        var data = await r.json().catch(function () { return {}; });
        if (!r.ok) throw new Error(data.error || "Erreur serveur");
        return data;
      });
    }

    function escapeHtml(s) {
      if (!s) return "";
      var el = document.createElement("div");
      el.textContent = String(s);
      return el.innerHTML;
    }

    function renderPurchased(leads) {
      var container = document.getElementById("achats-list");
      if (!leads.length) {
        container.innerHTML = '<p style="color:var(--text-muted);">Vous n\'avez pas encore acheté de lead.</p>';
        return;
      }
      var html = "";
      leads.forEach(function (lead) {
        html += '<div class="lead-item">';
        html += '<strong>' + escapeHtml(lead.trade_type) + '</strong> — ' + escapeHtml(lead.location_city || "Non précisé") + ' — Acheté le ' + new Date(lead.sold_at).toLocaleDateString() + '<br>';
        html += '<span style="color:var(--text-muted);">Client : ' + escapeHtml(lead.client_name || "—") + ' — ' + escapeHtml(lead.client_phone || "—") + '</span>';
        html += '</div>';
      });
      container.innerHTML = html;
    }

    async function loadPurchased() {
      try {
        const purchased = await api("/api/leads/purchased");
        renderPurchased(purchased);
      } catch (e) {
        console.error("Erreur achats", e);
        document.getElementById("achats-list").innerHTML = '<p style="color:var(--accent);">Erreur de chargement.</p>';
      }
    }

    loadPurchased();

    fetch('header.html').then(r => r.text()).then(html => {
      document.getElementById('header-placeholder').innerHTML = html;
    });
    fetch('footer.html').then(r => r.text()).then(html => {
      document.getElementById('footer-placeholder').innerHTML = html;
    });
  </script>
</body>
</html>
