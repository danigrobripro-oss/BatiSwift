<!-- header-minimal.html – Logo + nom, sans navigation -->
<header class="header header--minimal">
  <div class="container header__inner">
    <a href="index.html" class="logo" aria-label="BâtiSwift accueil">
      <svg width="60" height="60" viewBox="0 0 650 400" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <mask id="swift-separation-minimal">
            <rect width="650" height="400" fill="#ffffff" />
            <path d="M 235,195 C 285,175 335,148 385,132 C 340,152 290,182 245,202 Z" fill="#000000" />
          </mask>
        </defs>
        <rect width="100%" height="100%" fill="transparent" />
        <g fill="#FF007F">
          <path d="M 205,115 L 205,135 L 235,135 L 250,150 L 235,165 L 205,165 L 205,185 C 245,196 265,190 290,175 C 320,175 350,185 380,205 L 460,150 L 380,95 C 350,115 320,125 290,125 C 265,110 245,104 205,115 Z" mask="url(#swift-separation-minimal)" />
        </g>
        <g fill="#FF007F" opacity="0.15" filter="blur(6px)">
          <path d="M 205,115 L 205,135 L 235,135 L 250,150 L 235,165 L 205,165 L 205,185 C 245,196 265,190 290,175 C 320,175 350,185 380,205 L 460,150 L 380,95 C 350,115 320,125 290,125 C 265,110 245,104 205,115 Z" mask="url(#swift-separation-minimal)" />
        </g>
      </svg>
      <span style="display:inline-flex;font-size:1.2rem;font-weight:800;">Bâti<span style="color:#FF007F;">Swift</span></span>
    </a>
    <!-- Aucun menu, mais on peut ajouter un lien "Espace pro" si connecté -->
    <div style="display:flex;align-items:center;gap:1rem;">
      <span id="online-artisans-mini" style="font-size:0.8rem;color:var(--text-muted);">👷 <span id="artisans-count-mini">0</span> en ligne</span>
      <a href="artisan-dashboard.html" id="nav-dashboard-mini" style="display:none;color:var(--accent);font-weight:600;text-decoration:none;">Espace pro</a>
    </div>
  </div>
</header>

<script>
  (function() {
    const TOKEN_KEY = "batiswift-artisan-token";
    const token = localStorage.getItem(TOKEN_KEY);
    const dashboardLink = document.getElementById('nav-dashboard-mini');
    if (token && dashboardLink) {
      dashboardLink.style.display = 'inline';
    }
  })();

  async function loadArtisansCountMini() {
    try {
      const res = await fetch('https://agent-btp.onrender.com/api/stats/public');
      const data = await res.json();
      document.getElementById('artisans-count-mini').textContent = data.artisans || 0;
    } catch(e) { console.error('Erreur compteur', e); }
  }
  loadArtisansCountMini();
</script>
