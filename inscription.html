<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription Artisan – BâtiSwift</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="page-loader" class="page-loader"><div class="spinner spinner-dark" style="width:40px; height:40px;"></div></div>
  <header>
    <div class="container">
      <a href="index.html" class="nav-logo"><img src="assets/logo.svg" alt="BâtiSwift" class="logo-svg"> BâtiSwift</a>
      <nav>
        <ul class="nav-links">
          <li><a href="index.html">Accueil</a></li>
          <li><a href="connexion.html">Connexion</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="section" style="padding-top: 120px;">
      <div class="container-xs">
        <h2 class="text-center reveal">Inscription artisan</h2>
        <form id="register-form" class="glass-card mt-lg reveal reveal-delay-1">
          <div class="form-group">
            <label class="form-label">Nom complet <span class="req">*</span></label>
            <input type="text" id="reg-nom" class="form-control" required>
          </div>
          <div class="form-group">
            <label class="form-label">E-mail <span class="req">*</span></label>
            <input type="email" id="reg-email" class="form-control" required>
          </div>
          <div class="form-group">
            <label class="form-label">Mot de passe <span class="req">*</span> (6 caractères min)</label>
            <input type="password" id="reg-password" class="form-control" minlength="6" required>
          </div>
          <div class="form-group">
            <label class="form-label">Téléphone <span class="req">*</span></label>
            <input type="tel" id="reg-telephone" class="form-control" required>
          </div>
          <div class="form-group">
            <label class="form-label">Ville <span class="req">*</span></label>
            <input type="text" id="reg-ville" class="form-control" required>
          </div>
          <div class="form-group">
            <label class="form-label">Rayon d'intervention (km)</label>
            <input type="number" id="reg-rayon" class="form-control" value="30" min="1">
          </div>
          <div class="form-group">
            <label class="form-label">Spécialité</label>
            <select id="reg-specialite" class="form-control">
              <option value="">Non spécifié</option>
              <option value="plomberie">Plomberie</option>
              <option value="electricite">Électricité</option>
              <option value="peinture">Peinture</option>
              <option value="maconnerie">Maçonnerie</option>
              <option value="chauffage">Chauffage</option>
              <option value="serrurerie">Serrurerie</option>
              <option value="autre">Autre</option>
            </select>
          </div>
          <div id="register-error" class="alert alert-danger hidden"></div>
          <button type="submit" class="btn btn-primary btn-block btn-lg">Créer mon compte</button>
        </form>
        <p class="text-center mt-md">Déjà inscrit ? <a href="connexion.html">Connectez-vous</a></p>
      </div>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/session.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        nom: document.getElementById('reg-nom').value,
        email: document.getElementById('reg-email').value,
        password: document.getElementById('reg-password').value,
        telephone: document.getElementById('reg-telephone').value,
        ville: document.getElementById('reg-ville').value,
        rayon: parseInt(document.getElementById('reg-rayon').value) || 30,
        specialite: document.getElementById('reg-specialite').value
      };
      const errorDiv = document.getElementById('register-error');
      errorDiv.classList.add('hidden');
      try {
        await register(payload);
        window.location.href = 'dashboard.html';
      } catch(err) {
        errorDiv.textContent = err.message;
        errorDiv.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
