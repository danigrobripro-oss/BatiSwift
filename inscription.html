<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Inscription – BâtiSwift</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script>
    (function() {
      var t = localStorage.getItem("batiswift-theme");
      if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches)) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
      var translucide = localStorage.getItem("batiswift-translucide");
      if (translucide === "true") document.body.classList.add("translucide");
    })();
  </script>
</head>
<body>

<div id="header-placeholder"></div>

<main class="container" style="padding:3rem 0;">
  <div class="glass" style="max-width:560px;margin:0 auto;padding:2.5rem;">
    <h1 style="font-size:1.8rem;">👷 Inscription artisan</h1>
    <p style="color:var(--text-muted);margin-bottom:1.5rem;">Rejoignez BâtiSwift et recevez des clients qualifiés.</p>
    <form id="register-form">
      <div class="form-group">
        <label>Nom / raison sociale *</label>
        <input type="text" id="art-name" placeholder="SARAS Plomberie" required />
      </div>
      <div class="form-group">
        <label>Email professionnel *</label>
        <input type="email" id="art-email" placeholder="contact@artisan.fr" required />
      </div>
      <div class="form-group">
        <label>Téléphone</label>
        <input type="tel" id="art-phone" placeholder="0612345678" />
      </div>
      <div class="form-group">
        <label>Métier principal</label>
        <select id="art-trade">
          <option value="">Sélectionner</option>
          <option>Plomberie</option><option>Électricité</option><option>Peinture</option>
          <option>Maçonnerie</option><option>Chauffage</option><option>Serrurerie</option><option>Autre</option>
        </select>
      </div>
      <div class="form-group">
        <label>Zone d’intervention (ville/CP)</label>
        <input type="text" id="art-zone" placeholder="Ex: Lyon, 69003" />
      </div>
      <button type="submit" class="btn btn--primary btn--block">S’inscrire</button>
      <div id="form-error" style="color:var(--accent);margin-top:0.5rem;"></div>
    </form>
    <div id="success-container" style="display:none;text-align:center;padding:1rem 0;">
      <div style="color:#2ecc71;font-size:1.2rem;">✅ Inscription réussie !</div>
      <p style="margin-top:1rem;">Votre lien d’accès :</p>
      <div id="dashboard-url" style="word-break:break-all;background:var(--bg-muted);padding:0.5rem;border-radius:12px;"></div>
      <a href="#" id="dashboard-link" class="btn btn--primary" target="_blank" style="margin-top:1rem;">Ouvrir mon espace</a>
    </div>
  </div>
</main>

<div id="footer-placeholder"></div>

<script>
  const API_BASE = "https://agent-btp.onrender.com";
  const form = document.getElementById('register-form');
  const errorEl = document.getElementById('form-error');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('art-name').value.trim();
    const email = document.getElementById('art-email').value.trim();
    const phone = document.getElementById('art-phone').value.trim();
    const trade = document.getElementById('art-trade').value;
    const zone = document.getElementById('art-zone').value.trim();
    if (!name || !email) { errorEl.textContent = 'Nom et email obligatoires.'; return; }
    errorEl.textContent = '';
    const btn = form.querySelector('button[type="submit"]');
    btn.disabled = true; btn.textContent = 'Inscription...';
    try {
      const res = await fetch(`${API_BASE}/api/artisan/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, phone, trade, zone })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Erreur');
      document.getElementById('dashboard-url').textContent = data.dashboard_url;
      document.getElementById('dashboard-link').href = data.dashboard_url;
      document.getElementById('success-container').style.display = 'block';
      form.style.display = 'none';
    } catch (err) {
      errorEl.textContent = err.message;
    } finally {
      btn.disabled = false; btn.textContent = "S'inscrire";
    }
  });

  fetch('header.html').then(r => r.text()).then(html => {
    document.getElementById('header-placeholder').innerHTML = html;
  });
  fetch('footer.html').then(r => r.text()).then(html => {
    document.getElementById('footer-placeholder').innerHTML = html;
  });
</script>

</body>
</html>
