<style>
.market-page{padding:2rem 0 4rem;min-height:70vh}
.market-head{display:flex;justify-content:space-between;gap:1rem;align-items:end;margin-bottom:1.5rem}
.market-head h1{font-family:var(--font-display);margin:0 0 .4rem;color:var(--anthracite)}
.market-head p{margin:0;color:var(--gris);max-width:700px}
.market-actions{display:flex;gap:.6rem;flex-wrap:wrap}
.market-bar{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:1rem;margin-bottom:1rem;background:var(--blanc);border:1.5px solid var(--beige-dark);border-radius:var(--radius-lg)}
.market-stats{display:flex;gap:1rem;flex-wrap:wrap;color:var(--gris);font-size:.9rem}
.market-stats strong{color:var(--anthracite)}
.market-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}
.market-card{background:var(--blanc);border:1.5px solid var(--beige-dark);border-radius:var(--radius-lg);padding:1.2rem;box-shadow:var(--shadow-sm)}
.market-card:hover{border-color:var(--or);box-shadow:var(--shadow-md)}
.market-top{display:flex;justify-content:space-between;gap:.7rem}
.market-card h2{font-family:var(--font-display);font-size:1.15rem;margin:0;color:var(--anthracite)}
.market-badge{padding:.25rem .6rem;border-radius:999px;background:rgba(201,154,76,.15);font-size:.72rem;font-weight:700}
.market-meta{display:grid;gap:.4rem;margin:1rem 0;color:var(--gris);font-size:.86rem}
.market-desc{color:var(--gris);line-height:1.5;font-size:.9rem;min-height:4.2em}
.market-foot{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-top:1rem;padding-top:1rem;border-top:1px solid var(--beige-dark)}
.market-price{font-family:var(--font-display);font-size:1.3rem;font-weight:700;color:var(--anthracite)}
.market-price small{display:block;font:normal .7rem var(--font-body);color:var(--gris)}
.market-empty,.market-error,.market-loading{grid-column:1/-1;text-align:center;padding:2rem;background:var(--blanc);border:1.5px solid var(--beige-dark);border-radius:var(--radius-lg);color:var(--gris)}
.modal{display:none;position:fixed;inset:0;background:rgba(26,15,35,.65);z-index:9999;align-items:center;justify-content:center;padding:1rem}
.modal.open{display:flex}
.modal-box{width:min(540px,100%);max-height:92vh;overflow:auto;background:var(--blanc);border-radius:var(--radius-lg);padding:1.4rem;border:1.5px solid var(--beige-dark);box-shadow:var(--shadow-lg)}
.modal-head{display:flex;justify-content:space-between;align-items:start}
.modal-head h2{font-family:var(--font-display);margin:0;color:var(--anthracite)}
.modal-close{border:0;background:none;font-size:1.7rem;cursor:pointer}
.summary{background:var(--gris-ultra);border:1px solid var(--beige-dark);border-radius:12px;padding:1rem;margin:1rem 0}
.card-box{border:1.5px solid var(--beige-dark);border-radius:12px;padding:1rem}
#card-errors{color:var(--danger,#b42318);font-size:.85rem;min-height:1.3em;margin:.5rem 0}
.modal-actions{display:flex;justify-content:flex-end;gap:.6rem;margin-top:1rem}
@media(max-width:760px){.market-head{flex-direction:column;align-items:flex-start}.market-grid{grid-template-columns:1fr}.market-bar{align-items:flex-start;flex-direction:column}}
</style>
  <script src="/icons.js"></script>
</head>

document.addEventListener('DOMContentLoaded',async function(){
'use strict';

/* Espace artisan : rôle vérifié (un client est redirigé). Le serveur reste l'autorité finale. */
const user=await Session.requireRole('artisan');
if(!user)return;

const leadsEl=document.getElementById('leads');
const countEl=document.getElementById('count');
const radiusEl=document.getElementById('radius');
const modal=document.getElementById('buy-modal');
const summary=document.getElementById('summary');
const errors=document.getElementById('card-errors');
const payBtn=document.getElementById('pay');
let leads=[];
let selected=null;
let stripe=null;
let card=null;
let clientSecret=null;
let autoOpened=false;

const URGENCE={
  immediate:'<svg class="bs-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#ic-siren"/></svg> Urgent',
  urgent:'<svg class="bs-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#ic-siren"/></svg> Urgent',
  normale:'<svg class="bs-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#ic-calendar"/></svg> Normal',
  normal:'<svg class="bs-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#ic-calendar"/></svg> Normal',
  faible:'<svg class="bs-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#ic-clock"/></svg> Flexible',
  flexible:'<svg class="bs-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#ic-clock"/></svg> Flexible',
  soon:'<svg class="bs-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#ic-lightning"/></svg> Prochainement'
};

function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]})}

/* apiFetch (api.js) : JWT, timeout, nouvel essai réseau, déconnexion propre sur 401 */
function api(path,opt){return apiFetch(path,opt||{})}

function notify(msg,type){
  if(typeof toast==='function')toast(msg,type||'success',7000);else alert(msg);
}

function load(){
  leadsEl.innerHTML='<div class="market-loading"><svg class="bs-icon bs-icon-spin" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#ic-loader"/></svg> Recherche des demandes dans votre zone…</div>';
  return api('/api/artisan/leads').then(d=>{
    leads=Array.isArray(d.available)?d.available:[];
    countEl.textContent=leads.length;
    radiusEl.textContent=(d.radius_km||user.rayon||30)+' km';
    render();
    openRequestedLead();
  }).catch(showLoadError);
}

function showLoadError(e){
  console.error('[Marketplace]',e);
  const msg=(e&&e.message)?e.message:'Erreur inconnue.';
  if(/confirmer votre adresse email/i.test(msg)){renderUnconfirmed(msg);return}
  leadsEl.innerHTML='<div class="market-error"><strong>Impossible de charger les leads.</strong><p>'+esc(msg)+'</p><button id="retry" class="btn btn-secondary btn-sm" type="button">Réessayer</button></div>';
  document.getElementById('retry').onclick=load;
}

/* Le serveur exige un email confirmé : on n'y touche pas, on aide à le confirmer réellement. */
function renderUnconfirmed(msg){
  const email=user.email||'';
  leadsEl.innerHTML='<div class="market-error">'+
    '<strong>Adresse email non confirmée</strong>'+
    '<p>'+esc(msg)+'</p>'+
    (email?'<p>Compte : <strong>'+esc(email)+'</strong></p>':'')+
    '<p id="confirm-state" style="font-size:.88rem">Vérification de l’état de votre compte…</p>'+
    '<div style="display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap;margin-top:.8rem">'+
      (email?'<button id="resend" class="btn btn-gold btn-sm" type="button">Renvoyer l’email de confirmation</button>':'')+
      '<button id="retry" class="btn btn-secondary btn-sm" type="button">Réessayer</button>'+
    '</div></div>';
  document.getElementById('retry').onclick=load;
  const state=document.getElementById('confirm-state');
  api('/api/me').then(d=>{
    const a=d&&d.artisan;
    state.textContent=(a&&a.confirmed)
      ?'Le serveur indique que votre compte est confirmé. Cliquez sur « Réessayer » ; si le message persiste, déconnectez-vous puis reconnectez-vous.'
      :'Le serveur indique que votre compte n’est pas encore confirmé. Ouvrez l’email reçu et cliquez sur le lien de confirmation, ou demandez un nouvel email.';
  }).catch(()=>{state.textContent=''});
  const resend=document.getElementById('resend');
  if(resend)resend.onclick=function(){
    resend.disabled=true;
    API.resendConfirmation(email).then(r=>{state.textContent=(r&&r.message)||'Un email de confirmation vient d’être envoyé.'})
      .catch(err=>{state.textContent=err.message})
      .finally(()=>{resend.disabled=false});
  };
}

function render(){
  if(!leads.length){
    leadsEl.innerHTML='<div class="market-empty"><div style="font-size:2rem"><svg class="bs-icon" viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#ic-info"/></svg></div><strong>Aucun lead disponible dans votre zone.</strong><p>Les nouvelles demandes apparaîtront ici automatiquement.</p></div>';
    return;
  }
  leadsEl.innerHTML=leads.map(l=>{
    const type=l.type_travaux||l.trade_type||'Travaux';
    const city=l.client_ville||l.location_city||'Non précisée';
    const u=URGENCE[l.urgence||l.urgency]||URGENCE.normale;
    const distance=l.distance_km!=null?('<svg class="bs-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#ic-location-pin"/></svg> ~'+Number(l.distance_km)+' km'):('<svg class="bs-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#ic-location-pin"/></svg> Dans votre zone');
    const desc=l.description||'Aucune description disponible.';
    return '<article class="market-card">'+
      '<div class="market-top"><div><h2>'+esc(type)+'</h2><small style="color:var(--gris)">Demande #'+esc(l.id)+'</small></div><span class="market-badge">Disponible</span></div>'+
      '<div class="market-meta"><span><svg class="bs-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#ic-accueil"/></svg> '+esc(city)+'</span><span>'+distance+'</span><span>'+u+'</span></div>'+
      '<div class="market-desc">'+esc(desc.slice(0,300))+(desc.length>300?'…':'')+'</div>'+
      '<div class="market-foot"><div class="market-price">10 €<small>par lead</small></div><button class="btn btn-gold btn-sm buy" data-id="'+esc(l.id)+'">Acheter le lead</button></div>'+
      '</article>';
  }).join('');
  leadsEl.querySelectorAll('.buy').forEach(b=>b.onclick=()=>openModal(Number(b.dataset.id)));
}

/* /marketplace.html?lead=ID (depuis le tableau de bord) ouvre directement l'achat de ce lead */
function openRequestedLead(){
  if(autoOpened)return;
  autoOpened=true;
  const id=Number(new URLSearchParams(window.location.search).get('lead'));
  if(id&&leads.some(l=>Number(l.id)===id))openModal(id);
}

function openModal(id){
  selected=leads.find(l=>Number(l.id)===id);
  if(!selected)return;
  const desc=selected.description||'';
  summary.innerHTML='<h3 style="font-family:var(--font-display);margin:0 0 .5rem">'+esc(selected.type_travaux||'Travaux')+'</h3>'+
    '<p>'+bsIcon('ic-location-pin',16)+' '+esc(selected.client_ville||'Non précisée')+'</p><p>'+bsIcon('ic-money',16)+' 10 €</p><p>'+esc(desc.slice(0,250))+'</p>';
  errors.textContent='';
  modal.classList.add('open');modal.setAttribute('aria-hidden','false');
  preparePayment();
}

function destroyCard(){
  try{if(card)card.destroy()}catch(e){}
  card=null;stripe=null;clientSecret=null;
}
function closeModal(){
  modal.classList.remove('open');modal.setAttribute('aria-hidden','true');
  selected=null;destroyCard();errors.textContent='';
  payBtn.disabled=true;payBtn.innerHTML='<svg class="bs-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#ic-credit-card"/></svg> Payer 10 €';
}

function preparePayment(){
  destroyCard();
  payBtn.disabled=true;payBtn.innerHTML='<svg class="bs-icon bs-icon-spin" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#ic-loader"/></svg> Préparation…';
  const leadId=selected.id;
  const loadStripe=window.Stripe?Promise.resolve():new Promise((ok,no)=>{
    const s=document.createElement('script');s.src='https://js.stripe.com/v3/';s.onload=ok;s.onerror=()=>no(new Error('Impossible de charger Stripe.'));document.head.appendChild(s);
  });
  loadStripe.then(()=>api('/api/create-payment-intent',{method:'POST',body:JSON.stringify({lead_id:leadId})}))
  .then(d=>{
    if(!selected||selected.id!==leadId)return; /* modale fermée entre-temps */
    if(!d.publishable_key||!d.client_secret)throw new Error('Stripe n’a pas fourni les informations de paiement.');
    stripe=Stripe(d.publishable_key);
    const elements=stripe.elements();
    card=elements.create('card');
    card.mount('#card-element');
    card.on('change',e=>errors.textContent=e.error?e.error.message:'');
    clientSecret=d.client_secret;
    payBtn.disabled=false;payBtn.innerHTML='<svg class="bs-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#ic-credit-card"/></svg> Payer 10 €';
  }).catch(e=>{
    errors.textContent=e.message;payBtn.disabled=true;payBtn.innerHTML='<svg class="bs-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#ic-credit-card"/></svg> Payer 10 €';
    /* lead pris entre-temps par un autre artisan : on rafraîchit la liste */
    if(/plus disponible/i.test(e.message))setTimeout(function(){closeModal();load()},2500);
  });
}

payBtn.onclick=async function(){
  if(!stripe||!card||!clientSecret)return;
  payBtn.disabled=true;payBtn.innerHTML='<svg class="bs-icon bs-icon-spin" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#ic-loader"/></svg> Paiement…';errors.textContent='';
  try{
    const result=await stripe.confirmCardPayment(clientSecret,{payment_method:{card:card}});
    if(result.error)throw new Error(result.error.message);
    if(!result.paymentIntent||result.paymentIntent.status!=='succeeded')throw new Error('Le paiement n’a pas été confirmé.');
    closeModal();
    /* L'attribution du lead est faite par le serveur (webhook Stripe), jamais par cette page. */
    notify('<svg class="bs-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#ic-check"/></svg> Paiement reçu. Le lead vous est attribué dès la confirmation du serveur (quelques secondes) : retrouvez-le dans « Mes achats ».','success');
    setTimeout(load,1500);setTimeout(load,6000);
  }catch(e){
    errors.textContent=e.message;
    payBtn.disabled=!(stripe&&card&&clientSecret);payBtn.innerHTML='<svg class="bs-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#ic-credit-card"/></svg> Payer 10 €';
  }
};
document.getElementById('close-modal').onclick=closeModal;
document.getElementById('cancel-buy').onclick=closeModal;
modal.onclick=e=>{if(e.target===modal)closeModal()};
document.getElementById('refresh').onclick=load;

/* Le header (menu, bascule de contexte, déconnexion) est injecté et géré par main.js + header.html :
   plus de second chargement ni de second gestionnaire ici. */
load();
});
</script>
</body>
</html>
