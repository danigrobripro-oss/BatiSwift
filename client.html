<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Déposer une demande – BâtiSwift</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="page-loader" class="page-loader"><div class="spinner spinner-dark" style="width:40px; height:40px;"></div></div>
  <header>
    <div class="container">
      <a href="index.html" class="nav-logo"><img src="assets/logo.svg" alt="BâtiSwift" class="logo-svg"> BâtiSwift</a>
      <nav>
        <ul class="nav-links">
          <li><a href="index.html">Accueil</a></li>
          <li><a href="client.html" class="active">Déposer une demande</a></li>
        </ul>
      </nav>
      <div class="nav-actions">
        <a href="connexion.html" class="btn btn-secondary btn-sm">Connexion</a>
      </div>
    </div>
  </header>

  <main>
    <section class="section" style="padding-top: 120px;">
      <div class="container-xs">
        <h2 class="text-center reveal">Décrivez votre besoin</h2>
        <p class="text-center reveal reveal-delay-1">Notre assistant vous posera quelques questions puis transmettra votre demande aux artisans.</p>
        <form id="client-form" class="glass-card mt-lg reveal reveal-delay-2">
          <div class="form-group">
            <label class="form-label">Votre nom <span class="req">*</span></label>
            <input type="text" name="nom" class="form-control" placeholder="ex: Jean Dupont" required>
          </div>
          <div class="form-group">
            <label class="form-label">Téléphone <span class="req">*</span></label>
            <input type="tel" name="telephone" class="form-control" placeholder="0612345678" required>
          </div>
          <div class="form-group">
            <label class="form-label">Ville du chantier <span class="req">*</span></label>
            <input type="text" name="ville" class="form-control" placeholder="ex: Lyon" required>
          </div>
          <div class="form-group">
            <label class="form-label">Description du problème <span class="req">*</span></label>
            <textarea name="description" class="form-control" rows="5" placeholder="Décrivez précisément votre besoin..." required></textarea>
          </div>
          <div id="client-error" class="alert alert-danger hidden"></div>
          <div id="client-success" class="alert alert-success hidden"></div>
          <button type="submit" class="btn btn-primary btn-block btn-lg">Envoyer ma demande</button>
        </form>
      </div>
    </section>
  </main>

  <footer>...</footer> <!-- Footer identique à index.html -->

  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
