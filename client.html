<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Déposer une demande — BâtiSwift</title>

  <!-- ─── FAVICON ─── -->
  <link rel="icon" href="/assets/favicon.ico" type="image/x-icon" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png" />
<link rel="icon" type="image/svg+xml" href="/assets/favicon-v2.svg">
<link rel="icon" type="image/svg+xml" href="/assets/favicon-v2.svg" />
<link rel="icon" type="image/svg+xml" href="/assets/favicon-v2.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />
  <link rel="manifest" href="/assets/site.webmanifest" />
  <meta name="theme-color" content="#F5F0EB" />

  <link rel="stylesheet" href="/css/style.css">
  <style>
    /* ... styles identiques à ton fichier actuel ... */
  </style>
</head>
<body>

<div id="page-loader" class="page-loader"><div class="spinner spinner-dark"></div></div>
<div id="header-container"></div>

<!-- Bandeau conditionnel (masqué par défaut) -->
<div id="user-banner" class="user-banner" style="display:none;">
  <span class="banner-name" id="banner-text"></span>
  <a href="#" id="banner-action" class="btn">Mon espace</a>
</div>

<main class="main-content">
  <div class="client-layout">

    <!-- ── CHAT ── -->
    <div class="chat-pane">
      <!-- ... chat identique ... -->
    </div>

    <!-- ── INFO PANE ── -->
    <div class="info-pane">
      <h2>Votre demande</h2>
      <p style="color:var(--gris);font-size:.9rem;margin-bottom:var(--space-lg)">Laissez vos coordonnées pour qu'un artisan puisse vous rappeler.</p>

      <div class="contact-form">
        <div class="form-group">
          <label class="form-label" for="client-nom">Votre prénom</label>
          <input id="client-nom" type="text" class="form-control" placeholder="Marie">
        </div>
        <div class="form-group">
          <label class="form-label" for="client-telephone">Téléphone <span class="req">*</span></label>
          <input id="client-telephone" type="tel" class="form-control" placeholder="06 12 34 56 78" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="client-email">E-mail <span class="req">*</span></label>
          <input id="client-email" type="email" class="form-control" placeholder="vous@exemple.fr" required>
        </div>
        <!-- NOUVEAU : Adresse du chantier -->
        <div class="form-group">
          <label class="form-label" for="client-adresse">Adresse du chantier <span class="req">*</span></label>
          <input id="client-adresse" type="text" class="form-control" placeholder="N°, rue, code postal, ville" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="client-contact-pref">Préférence de contact / Application de messagerie (optionnel)</label>
          <input id="client-contact-pref" type="text" class="form-control" placeholder="WhatsApp, Telegram, etc.">
        </div>
      </div>

      <!-- ... étapes et réassurance identiques ... -->
    </div>

  </div>
</main>

<div id="footer-container"></div>

<script src="/js/config.js"></script>
<script src="/js/api.js"></script>
<script src="/js/session.js"></script>
<script src="/js/main.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  let historique = [];
  let leadCreated = false;
  const msgs   = document.getElementById('chat-messages');
  const input  = document.getElementById('chat-input');
  const btn    = document.getElementById('btn-send');

  // ─── Bandeau utilisateur connecté ─────────────────────
  function checkUserBanner() {
    const user = JSON.parse(localStorage.getItem(CONFIG.USER_KEY) || 'null');
    if (!user) return;

    const banner = document.getElementById('user-banner');
    const textEl = document.getElementById('banner-text');
    const actionBtn = document.getElementById('banner-action');

    if (user.role === 'artisan') {
      textEl.textContent = `🛠️ Bonjour ${user.nom || 'Artisan'} — vous êtes en mode Artisan.`;
      actionBtn.textContent = 'Retour au dashboard';
      actionBtn.href = '/dashboard.html';
    } else if (user.role === 'client') {
      textEl.textContent = `🏠 Bonjour ${user.nom || 'Client'} — vous êtes en mode Client.`;
      actionBtn.textContent = 'Mon espace';
      actionBtn.href = '/client.html';
    } else {
      return;
    }
    banner.style.display = 'flex';
  }
  checkUserBanner();

  function addMsg(role, content) {
    const d = document.createElement('div');
    d.className = `chat-bubble chat-${role} fade-in`;
    d.innerHTML = `<p>${content.replace(/\n/g,'<br>')}</p>`;
    msgs.appendChild(d);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function addTyping() {
    const d = document.createElement('div');
    d.id = 'typing'; d.className = 'chat-bubble chat-assistant';
    d.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
    msgs.appendChild(d); msgs.scrollTop = msgs.scrollHeight;
  }

  async function send(text) {
    if (!text.trim() || leadCreated) return;

    const telephone = document.getElementById('client-telephone')?.value.trim() || '';
    const email = document.getElementById('client-email')?.value.trim() || '';
    const adresse = document.getElementById('client-adresse')?.value.trim() || '';

    if (!telephone) {
      addMsg('assistant', '⚠️ Merci de renseigner votre numéro de téléphone pour qu’un artisan puisse vous rappeler.');
      return;
    }
    if (!email) {
      addMsg('assistant', '⚠️ Merci de renseigner votre e-mail pour recevoir les documents (devis, facture).');
      return;
    }
    if (!adresse) {
      addMsg('assistant', '⚠️ Merci de renseigner l’adresse du chantier pour que l’artisan puisse se déplacer.');
      return;
    }

    addMsg('user', text); input.value = ''; btn.disabled = true;
    addTyping();
    try {
      const data = await API.ask(text, historique, {
        nom:       document.getElementById('client-nom')?.value.trim() || '',
        telephone: telephone,
        email:     email,
        adresse:   adresse,
        contact_pref: document.getElementById('client-contact-pref')?.value.trim() || '',
      });
      document.getElementById('typing')?.remove();
      historique = data.historique || historique;
      addMsg('assistant', data.response);
      if (data.lead_created) {
        leadCreated = true;
        const conf = document.getElementById('lead-confirmation');
        if (conf) {
          conf.innerHTML = `<div class="alert alert-success" style="margin:0 var(--space-lg) var(--space-md)">
            ✅ Demande enregistrée ! Un artisan vous rappellera sous 1h. Référence #${data.lead_id}
          </div>`;
        }
        input.disabled = true; btn.disabled = true;
      }
    } catch {
      document.getElementById('typing')?.remove();
      addMsg('assistant', 'Désolé, une erreur est survenue. Rafraîchissez la page et réessayez.');
    } finally { btn.disabled = false; input.focus(); }
  }

  document.getElementById('chat-form').addEventListener('submit', e => { e.preventDefault(); send(input.value); });
  input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(input.value); } });

  input.addEventListener('input', function() { this.style.height = 'auto'; this.style.height = Math.min(this.scrollHeight, 100) + 'px'; });

  setTimeout(() => addMsg('assistant', 'Bonjour 👋 Je suis l\'assistant BâtiSwift.\n\nDécrivez-moi votre problème (plomberie, électricité, peinture...) et je mets en relation avec un artisan qualifié sous 1h — gratuitement !'), 500);
});
</script>
</body>
</html>
