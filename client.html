    </div>
    <nav class="nav-links">
      <a href="index.html">Accueil</a>
      <a href="artisan.html">Espace Artisan</a>
    </nav>
  </header>

  <main class="glass-card" style="max-width: 600px; margin: 2rem auto;">
    <h2>Décrivez votre besoin</h2>
    <form id="client-form" enctype="multipart/form-data">
      <input type="text" name="nom" placeholder="Votre nom complet" required>
      <input type="tel" name="telephone" placeholder="Téléphone" required>
      <input type="text" name="ville" placeholder="Ville" required>
      <textarea name="description" rows="4" placeholder="Décrivez le problème..." required></textarea>
      <label>Photos / vidéos (facultatif) :</label>
      <input type="file" name="photos" multiple accept="image/*,video/*">
      <div id="client-error" class="error-msg"></div>
      <div id="client-success" class="success-msg"></div>
      <button type="submit" class="btn-primary">Envoyer ma demande</button>
    </form>
  </main>

  <script src="script.js"></script>
  <script>
    document.getElementById("client-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const form = e.target;
      const formData = new FormData(form);
      const errorDiv = document.getElementById("client-error");
      const successDiv = document.getElementById("client-success");
      errorDiv.textContent = "";
      successDiv.textContent = "";

      try {
        const res = await fetch("https://agent-btp.onrender.com/api/client/request", {
          method: "POST",
          body: formData,
          credentials: "include"
        });
        const data = await res.json();
        if (res.ok) {
          successDiv.textContent = data.message || "Demande envoyée !";
          form.reset();
        } else {
          errorDiv.textContent = data.error || "Erreur lors de l'envoi.";
        }
      } catch (err) {
        errorDiv.textContent = "Impossible de contacter le serveur.";
      }
    });
  </script>
</body>
</html>
