<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BâtiSwift – Décrivez votre projet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- ===== HEADER ===== -->
  <header>
    <div class="container">
      <div class="logo">
        <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="40" height="40" rx="8" fill="#2B2B2B" />
          <path d="M12 14L20 22L28 14" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M12 22L20 30L28 22" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span>BâtiSwift</span>
      </div>
      <nav class="nav-links">
        <a href="index.html"><i class="fas fa-arrow-left"></i> Accueil</a>
      </nav>
    </div>
  </header>

  <!-- ===== CHAT ===== -->
  <div class="container">
    <div class="chat-container glass">
      <h2 style="text-align:center; margin-bottom: var(--spacing-sm);">Décrivez votre projet</h2>
      <div id="chat-messages" class="chat-messages">
        <!-- Les messages s'affichent ici -->
        <div class="message bot">Bonjour ! Décrivez-moi votre projet de rénovation ou construction.</div>
      </div>
      <form id="chat-form" class="chat-input">
        <textarea id="client-message" rows="2" placeholder="Ex : Rénovation complète de salle de bain, 10m², à Paris..." required></textarea>
        <button type="submit" id="send-btn">Envoyer</button>
      </form>
    </div>
  </div>

  <!-- ===== FOOTER ===== -->
  <footer>
    <div class="container">
      <p>© 2026 BâtiSwift – <a href="artisan.html">Espace Artisan</a></p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
