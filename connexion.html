<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion Artisan – BâtiSwift</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="page-loader" class="page-loader"><div class="spinner spinner-dark" style="width:40px; height:40px;"></div></div>
  <header>
    <div class="container">
      <a href="index.html" class="nav-logo"><img src="assets/logo.svg" alt="BâtiSwift" class="logo-svg"> BâtiSwift</a>
      <nav>
        <ul class="nav-links">
          <li><a href="index.html">Accueil</a></li>
          <li><a href="inscription.html">Inscription</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="section" style="padding-top: 120px;">
      <div class="container-xs">
        <h2 class="text-center reveal">Connexion artisan</h2>
        <form id="login-form" class="glass-card mt-lg reveal reveal-delay-1">
          <div class="form-group">
            <label class="form-label">E-mail</label>
            <input type="email" id="login-email" class="form-control" placeholder="vous@exemple.fr" required>
          </div>
          <div class="form-group">
            <label class="form-label">Mot de passe</label>
            <input type="password" id="login-password" class="form-control" required>
          </div>
          <div id="login-error" class="alert alert-danger hidden"></div>
          <button type="submit" class="btn btn-primary btn-block btn-lg">Se connecter</button>
        </form>
        <p class="text-center mt-md">Pas encore de compte ? <a href="inscription.html">Inscrivez-vous</a></p>
      </div>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/session.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      const errorDiv = document.getElementById('login-error');
      errorDiv.classList.add('hidden');
      try {
        await login(email, password);
        window.location.href = 'dashboard.html';
      } catch(err) {
        errorDiv.textContent = err.message;
        errorDiv.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
